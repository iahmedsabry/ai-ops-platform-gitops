apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iahmedsabry/ai-ops-platform-gitops.git
    targetRevision: HEAD
    path: manifests/agent-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true