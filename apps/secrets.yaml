apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: secrets
  namespace: argocd

spec:
  project: default

  source:
    # PER-ENVIRONMENT: Git URL for your GitOps repo (fork / org / per-environment branch or repo).
    repoURL: https://github.com/iahmedsabry/ai-ops-platform-gitops.git
    targetRevision: HEAD
    path: manifests/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: ai-ops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true