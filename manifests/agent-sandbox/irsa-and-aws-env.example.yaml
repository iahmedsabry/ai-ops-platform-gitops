# PER-ENVIRONMENT EXAMPLE: copy patterns into your cluster GitOps; replace account id, role name, namespace, and regions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox
  namespace: ai-ops
  annotations:
    # PER-ENVIRONMENT: real IAM role created for this account (trust = this cluster's OIDC provider).
    eks.amazonaws.com/role-arn: arn:aws:iam::917246193838:role/ai-ops-platform-agent-sandbox-billing-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox
  namespace: ai-ops
spec:
  template:
    spec:
      containers:
        - name: agent-sandbox
          env:
            # PER-ENVIRONMENT: prefer ConfigMap (app-config.env) in real manifests; values here are illustrative.
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_BILLING_REGION
              value: us-east-1