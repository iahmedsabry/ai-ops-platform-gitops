apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox
  template:
    metadata:
      labels:
        app: agent-sandbox
    spec:
      serviceAccountName: agent-sandbox
      containers:
        - name: agent-sandbox
          image: agent-sandbox-image
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agent-sandbox-runtime