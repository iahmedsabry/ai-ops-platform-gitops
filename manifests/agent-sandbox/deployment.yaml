apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox
  template:
    metadata:
      labels:
        app: agent-sandbox
    spec:
      # Namespace-level automount OFF would omit the apiserver JWT and produce 401
      # everywhere (prometheus_plain_http still succeeds). Explicit true restores it.
      automountServiceAccountToken: true
      serviceAccountName: agent-sandbox
      # Extra projected JWT (sandbox tries automount SAT first, then this path — see SANDBOX_K8S_SAT_*).
      volumes:
        - name: sandbox-kube-apiserver-sat
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3607
                  # Omit to let the kubelet use apiserver default audiences; tune if audits show audience mismatch:
                  # audience: https://kubernetes.default.svc
      containers:
        - name: agent-sandbox
          image: agent-sandbox-image
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: sandbox-kube-apiserver-sat
              mountPath: /var/run/secrets/sandbox/kube-apiserver
              readOnly: true

          # Liveness stays cheap; readiness proves in-cluster JWT + RBAC hit the apiserver.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5

          envFrom:
            - configMapRef:
                name: agent-sandbox-runtime