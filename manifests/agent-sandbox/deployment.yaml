apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox
  template:
    metadata:
      labels:
        app: agent-sandbox
    spec:
      containers:
        - name: agent-sandbox
          image: iahmedsabry/agent-sandbox:latest
          ports:
            - containerPort: 8000