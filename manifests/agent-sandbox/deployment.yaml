apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-sandbox
  template:
    metadata:
      labels:
        app: agent-sandbox
    spec:
      serviceAccountName: agent-sandbox
      containers:
        - name: agent-sandbox
          image: agent-sandbox-image
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          # Liveness stays cheap; readiness proves in-cluster JWT + RBAC hit the apiserver.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5

          envFrom:
            - configMapRef:
                name: agent-sandbox-runtime