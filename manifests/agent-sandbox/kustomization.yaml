# PER-ENVIRONMENT: namespace must match Argo CD Application destination for agent-sandbox (and RBAC binding in rbac.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-ops

resources:
  - deployment.yaml
  - service.yaml
  - rbac.yaml

# Keep ClusterRoleBinding subject.namespace aligned with the ServiceAccount namespace
# (avoids 403 when Argo deploys agent-sandbox to a namespace other than ai-ops).
replacements:
  - source:
      kind: ServiceAccount
      name: agent-sandbox
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: ClusterRoleBinding
          name: agent-sandbox-binding
        fieldPaths:
          - subjects.0.namespace

configMapGenerator:
  - name: agent-sandbox-runtime
    envs:
      - app-config.env

# PER-ENVIRONMENT: newName/newTag = your container registry and version (ECR, Docker Hub, etc.).
images:
  - name: agent-sandbox-image
    newName: iahmedsabry/agent-sandbox
    newTag: latest