apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-role
rules:
  # Pods + logs
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
    verbs: ["get", "list"]

  # Events
  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list"]

  # Services
  - apiGroups: [""]
    resources:
      - services
    verbs: ["get", "list"]

  # Deployments
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list"]

  # Ingress
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-binding
subjects:
  - kind: ServiceAccount
    name: agent-sandbox
    namespace: default
roleRef:
  kind: ClusterRole
  name: agent-sandbox-role
  apiGroup: rbac.authorization.k8s.io