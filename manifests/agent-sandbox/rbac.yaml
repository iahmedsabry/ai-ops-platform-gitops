# PER-ENVIRONMENT: add eks.amazonaws.com/role-arn on this ServiceAccount for AWS API access (see irsa-and-aws-env.example.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sandbox

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-sandbox-role

rules:

  # =====================================================
  # Pods + logs
  # =====================================================
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - pods/status
    verbs:
      - get
      - list

  # =====================================================
  # Events
  # =====================================================
  - apiGroups: [""]
    resources:
      - events
    verbs:
      - get
      - list

  # =====================================================
  # Services
  # =====================================================
  - apiGroups: [""]
    resources:
      - services
    verbs:
      - get
      - list

  # =====================================================
  # ServiceAccounts + Secrets (read-only audit only)
  # =====================================================
  - apiGroups: [""]
    resources:
      - serviceaccounts
      - secrets
    verbs:
      - get
      - list

  # =====================================================
  # Namespaces
  # =====================================================
  - apiGroups: [""]
    resources:
      - namespaces
    verbs:
      - get
      - list

  # =====================================================
  # Nodes
  # =====================================================
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - get
      - list

  # =====================================================
  # PVCs
  # =====================================================
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
    verbs:
      - get
      - list

  # =====================================================
  # Deployments / ReplicaSets / StatefulSets / DaemonSets
  # =====================================================
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - get
      - list

  # =====================================================
  # Ingresses
  # =====================================================
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs:
      - get
      - list

  # =====================================================
  # RBAC objects for security audit tools
  # =====================================================
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - get
      - list

  # =====================================================
  # PodDisruptionBudgets for availability/compliance checks
  # =====================================================
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list

  # =====================================================
  # Jobs + CronJobs
  # =====================================================
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list

  # =====================================================
  # Storage classes + PVs (cost / provisioning context)
  # =====================================================
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs:
      - get
      - list

  - apiGroups: [""]
    resources:
      - persistentvolumes
    verbs:
      - get
      - list

  # =====================================================
  # Namespace capacity controls
  # =====================================================
  - apiGroups: [""]
    resources:
      - resourcequotas
      - limitranges
    verbs:
      - get
      - list

  # =====================================================
  # Horizontal Pod Autoscalers (HPA)
  # =====================================================
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list

  # =====================================================
  # Argo CD Applications CRD
  # =====================================================
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
    verbs:
      - get
      - list

  - apiGroups: [""]
    resources:
      - endpoints
    verbs:
      - get
      - list

  # =====================================================
  # ConfigMaps (mounted app configs / manifests)
  # =====================================================
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - get
      - list

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-sandbox-binding

subjects:
  # PER-ENVIRONMENT: namespace must match agent-sandbox Kustomization + Argo CD destination.
  - kind: ServiceAccount
    name: agent-sandbox
    namespace: ai-ops

roleRef:
  kind: ClusterRole
  name: agent-sandbox-role
  apiGroup: rbac.authorization.k8s.io