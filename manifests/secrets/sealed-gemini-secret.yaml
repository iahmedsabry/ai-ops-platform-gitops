# PER-ENVIRONMENT: encrypted with a specific cluster's Sealed Secrets cert — regenerate with `kubeseal` for each EKS cluster.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: gemini-secret
  namespace: ai-ops
spec:
  encryptedData:
    GEMINI_API_KEY: 
  template:
    metadata:
      creationTimestamp: null
      name: gemini-secret
      namespace: ai-ops
    type: Opaque
