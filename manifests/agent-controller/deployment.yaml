apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-controller
  template:
    metadata:
      labels:
        app: agent-controller
    spec:
      containers:
        - name: agent-controller
          image: agent-controller-image
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5

          envFrom:
            - configMapRef:
                name: agent-controller-runtime

          env:
            # PER-ENVIRONMENT: Secret must exist in this namespace.
            # Docs-preferred var for non-interactive Copilot CLI auth.
            - name: COPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-auth-secret
                  key: COPILOT_PAT
            # Backward-compatible alias.
            - name: COPILOT_PAT
              valueFrom:
                secretKeyRef:
                  name: copilot-auth-secret
                  key: COPILOT_PAT
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-auth-secret
                  key: COPILOT_PAT