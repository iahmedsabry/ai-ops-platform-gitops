apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-controller
  template:
    metadata:
      labels:
        app: agent-controller
    spec:
      containers:
        - name: agent-controller
          image: agent-controller-image
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: agent-controller-runtime

          env:
            # PER-ENVIRONMENT: Secret must exist in this namespace; for new clusters re-seal GEMINI_API_KEY (see ENVIRONMENT_VALUES.md).
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY