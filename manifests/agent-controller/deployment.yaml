apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-controller
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-controller
  template:
    metadata:
      labels:
        app: agent-controller
    spec:
      containers:
        - name: agent-controller
          image: iahmedsabry/agent-controller:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000

          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-secret
                  key: GEMINI_API_KEY