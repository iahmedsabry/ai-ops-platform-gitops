# PER-ENVIRONMENT: namespace must match Argo CD Application destination for agent-controller (and DNS used in SANDBOX_EXECUTE_URL).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-ops

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: agent-controller-runtime
    envs:
      - app-config.env

# PER-ENVIRONMENT: newName/newTag = your container registry and version (ECR, Docker Hub, etc.).
images:
  - name: agent-controller-image
    newName: iahmedsabry/agent-controller
    newTag: latest
