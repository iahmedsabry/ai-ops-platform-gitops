apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
  labels:
    app: postgresql

spec:
  replicas: 1   # Single DB instance (PoC only)

  selector:
    matchLabels:
      app: postgresql

  template:
    metadata:
      labels:
        app: postgresql

    spec:
      containers:
        - name: postgresql
          image: postgres:15    # Official PostgreSQL image

          ports:
            - containerPort: 5432   # Default PostgreSQL port

          env:
            - name: POSTGRES_DB
              value: appdb          # Database name

            - name: POSTGRES_USER
              value: admin          # Username

            - name: POSTGRES_PASSWORD
              value: admin123       # Password (NOT secure, PoC only)
