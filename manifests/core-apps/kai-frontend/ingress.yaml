apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  annotations:
    kubernetes.io/ingress.class: alb

    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/group.name: shared-alb
    alb.ingress.kubernetes.io/group.order: "2"

    # `/chat` can exceed the ALB default idle timeout (60s) — Copilot + many tools runs minutes.
    # Valid range 1–4000. IngressGroup: use the same idle_timeout across all Ingresses in the group
    # or set it on only one; see aws-load-balancer-controller docs.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=600

spec:
  ingressClassName: alb

  rules:
    - http:
        paths:
          # KAI UI (static HTML in frontend pod)
          - path: /kai
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

          # Agent API — keep this path exclusive to agent-controller
          - path: /chat
            pathType: Prefix
            backend:
              service:
                name: agent-controller
                port:
                  number: 80
