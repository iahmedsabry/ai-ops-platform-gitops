apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#320B32">

        <base href="/kai/">

        <title>KAI</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

        <style>
          :root {
            color-scheme: light;
            /* Brand */
            --c-red: #DC0814;
            --c-pink: #D27889;
            --c-purple: #9B2381;
            --c-plum: #320B32;
            --c-highlight: #EAD3DA;
            --c-bg: #F2F2F2;

            --bg-main: var(--c-bg);
            --bg-sidebar: #ffffff;
            --bg-input: #ffffff;
            --bg-input-top: #faf8f9;
            --bg-input-bottom: var(--c-highlight);
            --input-border: rgba(50, 11, 50, 0.14);
            --input-ring: rgba(155, 35, 129, 0.28);
            --border-hair: rgba(50, 11, 50, 0.09);
            --text: var(--c-plum);
            --text-dim: rgba(50, 11, 50, 0.78);
            --muted: rgba(50, 11, 50, 0.52);
            --sidebar-w: 280px;
            --danger-bg: rgba(220, 8, 20, 0.1);
            --danger-text: #9a0610;
            --danger-br: rgba(220, 8, 20, 0.35);
            --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-family: var(--font-ui);
            font-feature-settings: "cv02", "cv11", "ss01";
          }

          * { box-sizing: border-box; }

          html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg-main);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-family: var(--font-ui);
          }

          body { background: var(--bg-main); }

          button {
            font: inherit;
            cursor: pointer;
          }

          .icon-plain {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            opacity: 0.92;
          }

          .icon-plain:hover {
            opacity: 1;
            background: rgba(210, 120, 137, 0.12);
          }

          .icon-plain svg {
            stroke: currentColor;
            fill: none;
          }

          .layout {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
          }

          /* Sidebar */
          /* Sidebar — warm surface, clearer hierarchy */
          .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: linear-gradient(
              180deg,
              #ffffff 0%,
              #faf8fa 55%,
              #f7f4f6 100%
            );
            border-right: 1px solid var(--border-hair);
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 30;
          }

          .sidebar-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 12px 8px;
            gap: 8px;
          }

          .link-new-chat {
            display: flex;
            align-items: center;
            gap: 7px;
            width: calc(100% - 20px);
            margin: 2px 10px 10px;
            padding: 10px 12px;
            border: none;
            border-radius: 11px;
            background: rgba(155, 35, 129, 0.04);
            color: var(--c-plum);
            font-size: 0.875rem;
            font-weight: 550;
            text-align: left;
            transition: background 0.15s ease, color 0.12s ease, box-shadow 0.15s ease;
          }

          .link-new-chat:hover {
            background: rgba(210, 120, 137, 0.14);
            color: var(--c-plum);
            box-shadow: inset 0 0 0 1px rgba(155, 35, 129, 0.1);
          }

          .link-new-chat:active {
            background: rgba(155, 35, 129, 0.1);
          }

          .link-new-chat svg {
            stroke: currentColor;
            flex-shrink: 0;
            width: 17px;
            height: 17px;
            transform: translateY(-1px);
            opacity: 1;
          }

          .sidebar-search-panel {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height .2s ease, opacity .15s ease;
            padding: 0 12px;
          }

          .sidebar-search-panel.open {
            max-height: 56px;
            opacity: 1;
            padding: 2px 12px 12px;
          }

          #chatSearch {
            width: 100%;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid var(--border-hair);
            background: #ffffff;
            color: var(--text);
            font-size: 0.84rem;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
          }

          #chatSearch:focus {
            border-color: rgba(155, 35, 129, 0.45);
            box-shadow: 0 0 0 3px rgba(155, 35, 129, 0.12);
          }

          #chatSearch::placeholder {
            color: var(--muted);
          }

          .sidebar-heading {
            margin: 4px 12px 0;
            padding: 6px 12px 8px;
            font-size: 0.65rem;
            font-weight: 650;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
          }

          .sidebar-list-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 10px 22px;
            scrollbar-width: thin;
            scrollbar-color: rgba(155, 35, 129, 0.25) transparent;
          }

          .sidebar-list-scroll::-webkit-scrollbar {
            width: 6px;
          }

          .sidebar-list-scroll::-webkit-scrollbar-thumb {
            background: rgba(155, 35, 129, 0.22);
            border-radius: 999px;
          }

          .sidebar-item {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 3px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-dim);
            text-align: left;
            transition:
              background 0.15s ease,
              color 0.12s ease,
              box-shadow 0.15s ease;
          }

          .sidebar-item:hover {
            color: var(--text);
            background: rgba(155, 35, 129, 0.06);
          }

          .sidebar-item.active {
            color: var(--c-purple);
            font-weight: 550;
            background: linear-gradient(
              135deg,
              rgba(234, 211, 218, 0.5),
              rgba(210, 120, 137, 0.12)
            );
            box-shadow: inset 0 0 0 1px rgba(155, 35, 129, 0.14);
          }

          .sidebar-item-title {
            font-size: 0.835rem;
            font-weight: inherit;
            line-height: 1.38;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }

          .sidebar-empty {
            text-align: center;
            padding: 24px 16px;
            margin: 10px 8px 0;
            font-size: 0.805rem;
            color: var(--muted);
            line-height: 1.55;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 12px;
            border: 1px dashed rgba(50, 11, 50, 0.1);
          }

          /* Main */
          .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg-main);
          }

          header.app-header {
            flex-shrink: 0;
            padding: 9px clamp(12px, 2.5vw, 22px);
            border-bottom: 1px solid var(--border-hair);
            background: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          }

          .header-left {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
          }

          #btnMenu {
            display: none;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text);
          }

          #btnMenu:hover {
            background: rgba(210, 120, 137, 0.14);
          }

          .brand h1 {
            margin: 0;
            line-height: 1.15;
            font-size: 1.06rem;
            font-weight: 650;
            letter-spacing: 0;
          }

          .brand-wordmark {
            display: inline-block;
            letter-spacing: 0.2em;
            font-weight: 700;
            font-size: 1.1em;
            background: linear-gradient(
              110deg,
              #320B32 0%,
              #9B2381 26%,
              #D27889 50%,
              #DC0814 72%,
              #9B2381 92%,
              #320B32 100%
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
          }

          @supports not ((-webkit-background-clip: text) or (background-clip: text)) {
            .brand-wordmark {
              color: var(--c-plum);
              background: none;
            }
          }

          .brand .subtitle {
            font-size: 0.7rem;
            color: var(--muted);
            margin: 2px 0 0;
            line-height: 1.4;
          }

          .model-pill {
            flex-shrink: 0;
            max-width: min(420px, 46vw);
            padding: 0;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--muted);
            background: transparent;
            border: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .model-pill .model-id {
            color: var(--c-purple);
            font-weight: 600;
          }

          .messages-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
          }

          .messages-inner {
            max-width: min(600px, 94vw);
            margin: 0 auto;
            padding: clamp(12px, 2vw, 20px)
              clamp(14px, 3vw, 28px)
              18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          }

          .msg-msg {
            display: flex;
            flex-direction: column;
            animation: rise .28s ease;
          }

          @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
          }

          .msg-msg.user { align-self: flex-end; max-width: min(560px, 92%); }
          .msg-msg.assistant { align-self: flex-start; max-width: min(720px, 96%); }

          .bubble-shell { width: 100%; }

          .bubble {
            border-radius: 12px;
            padding: 11px 14px;
            line-height: 1.5;
            font-size: 0.9rem;
            word-break: break-word;
            border: 1px solid var(--border-hair);
          }

          .msg-msg.user .bubble {
            background: linear-gradient(
              145deg,
              rgba(234, 211, 218, 0.85) 0%,
              rgba(255, 255, 255, 0.95) 100%
            );
            border-color: rgba(155, 35, 129, 0.22);
            white-space: pre-wrap;
          }

          .msg-msg.assistant .bubble {
            background: #ffffff;
            border-color: var(--border-hair);
            box-shadow: 0 1px 2px rgba(50, 11, 50, 0.04);
          }

          .bubble.error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-br);
          }

          .bubble.prose h3.md-heading {
            margin: 0 0 0.4em;
            font-size: 1.02rem;
            font-weight: 650;
            color: var(--c-plum);
          }

          .bubble.prose h4.md-heading {
            margin: 0.85em 0 0.35em;
            font-size: 0.9rem;
            font-weight: 640;
            color: var(--c-purple);
          }

          .bubble.prose h3.md-heading:first-child,
          .bubble.prose h4.md-heading:first-child { margin-top: 0; }

          .bubble.prose p.md-p {
            margin: 0.38em 0;
            white-space: pre-wrap;
          }

          .bubble.prose p.md-p:first-child { margin-top: 0; }
          .bubble.prose p.md-p:last-child { margin-bottom: 0; }

          .bubble.prose p.md-li {
            margin: 0.22em 0;
            padding-left: 1rem;
            position: relative;
            color: var(--text-dim);
          }

          .bubble.prose p.md-li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 0.62em;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--c-pink);
            opacity: 0.75;
          }

          .bubble.prose strong { font-weight: 650; color: var(--c-plum); }
          .bubble.prose .md-gap { height: 0.5em; }

          .typing-dot {
            display: inline-flex;
            gap: 5px;
            padding: 4px 0;
          }

          .typing-dot span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--c-pink);
            animation: bounce 1.15s infinite ease-in-out;
          }

          .typing-dot span:nth-child(2) { animation-delay: 0.13s; }
          .typing-dot span:nth-child(3) { animation-delay: 0.26s; }

          @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.55); opacity: 0.42; }
            40% { transform: scale(1); opacity: 0.9; }
          }

          /* Composer & message field — neon tunnel border (SVG) + white field */
          .composer {
            flex-shrink: 0;
            min-width: 0;
            position: relative;
            z-index: 24;
            padding: 12px clamp(12px, 3vw, 20px)
              calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-hair);
            background: linear-gradient(
              180deg,
              rgba(255, 255, 255, 0.88) 0%,
              var(--c-bg) 100%
            );
          }

          .composer-inner {
            max-width: min(600px, 94vw);
            width: 100%;
            min-width: 0;
            margin: 0 auto;
            overflow: visible;
            position: relative;
            z-index: 28;
          }

          /* Moving tunnel border: SVG layer (animations) inside fixed-radius clip */
          .input-aurora {
            position: relative;
            z-index: 0;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
            padding: 3px;
            margin: 8px 0 10px;
            border-radius: 24px;
            isolation: isolate;
            overflow: visible;
            background: transparent;
          }

          /* Clip tunnel ring to pill without clipping the attach popup (shell covers center) */
          .input-neon-ring {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            display: block;
            border-radius: 24px;
            overflow: hidden;
          }

          .input-shell {
            position: relative;
            z-index: 1;
            width: 100%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            border: none;
            border-radius: 21px;
            padding: 6px 8px;
            min-height: 48px;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(50, 11, 50, 0.08);
            transition: box-shadow 0.2s ease;
            overflow: visible;
          }

          .input-shell:focus-within {
            box-shadow:
              0 0 0 1px rgba(155, 35, 129, 0.25),
              0 2px 8px rgba(50, 11, 50, 0.08);
          }

          /* Previews live above row so buttons stay bottom-pinned independently */
          .composer-attachments {
            display: none;
            flex-direction: row;
            flex-wrap: nowrap;
            align-items: center;
            gap: 6px;
            width: 100%;
            min-width: 0;
            padding: 4px 0 8px;
            margin: -2px 0 0;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: thin;
          }

          .composer-attachments.has-items {
            display: flex;
          }

          .composer-attachments::-webkit-scrollbar {
            height: 4px;
          }

          .composer-attachments::-webkit-scrollbar-thumb {
            background: rgba(155, 35, 129, 0.28);
            border-radius: 999px;
          }

          .compose-att-chip {
            flex: 0 0 auto;
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: 5px;
            max-width: 148px;
            height: 32px;
            padding: 0 2px 0 4px;
            border-radius: 9px;
            border: 1px solid rgba(50, 11, 50, 0.1);
            background: rgba(250, 248, 249, 0.95);
            font-size: 0.72rem;
            color: var(--text-dim);
          }

          .compose-att-chip .compose-att-thumb-wrap {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(50, 11, 50, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
          }

          .compose-att-chip img.compose-att-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
          }

          .compose-att-chip .compose-att-file-dot {
            width: 26px;
            height: 26px;
            border-radius: 5px;
            background: rgba(155, 35, 129, 0.1);
            color: var(--c-purple);
            font-size: 0.62rem;
            font-weight: 700;
            line-height: 26px;
            text-align: center;
            flex-shrink: 0;
          }

          .compose-att-chip .compose-att-name {
            flex: 1 1 auto;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            line-height: 1.2;
          }

          .compose-att-remove {
            flex-shrink: 0;
            width: 26px;
            height: 26px;
            margin: 0;
            padding: 0;
            border: none;
            border-radius: 7px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition:
              background 0.18s ease,
              color 0.15s ease,
              box-shadow 0.2s ease;
          }

          .compose-att-remove:hover {
            background: rgba(220, 8, 20, 0.08);
            color: var(--c-red);
            box-shadow:
              0 0 0 1px rgba(220, 8, 20, 0.12),
              0 0 14px rgba(220, 8, 20, 0.12);
          }

          /* Bottom-pinned icons: row cross-axis aligns all items to bottom */
          .composer-row {
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            width: 100%;
            min-width: 0;
            gap: 4px;
            flex: 0 0 auto;
          }

          .composer-attach-slot {
            position: relative;
            z-index: 50;
            flex: 0 0 40px;
            width: 40px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 0;
          }

          .composer-textarea-wrap {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            align-items: stretch;
            align-self: flex-end;
          }

          .composer-send-slot {
            flex: 0 0 42px;
            width: 42px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 1px;
          }

          .composer-file-input {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
            opacity: 0;
          }

          .attach-menu-anchor {
            position: relative;
            z-index: 50;
            display: inline-flex;
            align-items: flex-end;
            justify-content: center;
          }

          .attach-menu {
            position: absolute;
            left: 0;
            bottom: calc(100% + 8px);
            z-index: 100;
            min-width: clamp(200px, 70vw, 260px);
            padding: 6px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid var(--border-hair);
            box-shadow: 0 8px 28px rgba(50, 11, 50, 0.1);
          }

          .attach-menu-item {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            width: 100%;
            padding: 9px 11px;
            margin: 0;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text);
            font-family: var(--font-ui);
            font-size: 0.8125rem;
            font-weight: 500;
            line-height: 1.35;
            cursor: pointer;
            text-align: left;
            transition: background 0.14s ease, color 0.12s ease;
          }

          .attach-menu-label {
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
            letter-spacing: 0.01em;
          }

          .attach-menu-item:hover {
            background: rgba(210, 120, 137, 0.12);
            color: var(--c-plum);
          }

          .attach-menu-item:active {
            background: rgba(155, 35, 129, 0.1);
          }

          .attach-menu-item .attach-menu-clip-wrap {
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translateY(-2px);
          }

          .attach-menu-item .attach-menu-clip-svg {
            width: 24px;
            height: 24px;
            display: block;
            color: currentColor;
          }

          .attach-menu-item .attach-menu-clip-svg path {
            stroke: currentColor;
            stroke-width: 1.34;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
          }

          .attach-btn {
            position: relative;
            z-index: 3;
            box-sizing: border-box;
            width: 38px;
            height: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
            color: var(--c-plum);
            transform: translateY(2px);
            transition:
              transform 0.15s ease,
              opacity 0.15s ease,
              background 0.15s ease,
              color 0.15s ease;
          }

          .attach-btn:hover {
            color: var(--c-plum);
            background: rgba(50, 11, 50, 0.06);
          }

          .attach-btn:active {
            transform: translateY(2px) scale(0.96);
          }

          .attach-btn .attach-plus-icon {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            fill: none;
            display: block;
            pointer-events: none;
            flex-shrink: 0;
          }

          .attach-btn .attach-badge {
            position: absolute;
            top: -1px;
            right: -1px;
            min-width: 16px;
            height: 16px;
            padding: 0 4px;
            border-radius: 999px;
            font-size: 0.62rem;
            font-weight: 700;
            line-height: 16px;
            text-align: center;
            color: #fff;
            background: linear-gradient(135deg, var(--c-purple), var(--c-pink));
            box-shadow: 0 1px 4px rgba(50, 11, 50, 0.25);
            pointer-events: none;
          }

          .attach-btn .attach-badge[hidden] {
            display: none !important;
          }

          .attach-btn.has-files {
            opacity: 1;
          }

          @media (prefers-reduced-motion: reduce) {
            .attach-btn:hover {
              background: rgba(50, 11, 50, 0.06);
            }
            .compose-att-remove:hover {
              box-shadow: none;
            }
            .input-neon-ring {
              display: none;
            }
            .input-aurora {
              background: linear-gradient(
                135deg,
                var(--c-purple),
                var(--c-pink),
                var(--c-purple)
              );
              animation: none;
              box-shadow: 0 1px 8px rgba(50, 11, 50, 0.1);
            }
          }

          /* Soft outer glow complements SVG tunnel glow */
          @media not (prefers-reduced-motion: reduce) {
            .input-aurora {
              box-shadow:
                0 0 24px rgba(155, 35, 129, 0.18),
                0 0 48px rgba(210, 120, 137, 0.1);
            }
          }

          #message {
            box-sizing: border-box;
            display: block;
            width: 100%;
            margin: 0;
            border: none;
            outline: none;
            resize: none;
            min-height: 40px;
            max-height: 200px;
            height: 40px;
            padding: 9px 4px 9px 2px;
            overflow-x: hidden;
            overflow-y: hidden;
            font-family: var(--font-ui);
            font-size: 0.895rem;
            font-weight: 400;
            line-height: 1.5;
            letter-spacing: 0.01em;
            background: transparent;
            color: var(--text);
            transition: height 0.18s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            flex: 0 0 auto;
            align-self: stretch;
            min-width: 0;
          }

          /* Thin scrollbar only at max height when content overflows */
          #message.is-overflowing {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(155, 35, 129, 0.4) transparent;
          }

          #message.is-overflowing::-webkit-scrollbar {
            width: 5px;
          }

          #message.is-overflowing::-webkit-scrollbar-track {
            background: transparent;
          }

          #message.is-overflowing::-webkit-scrollbar-thumb {
            background: rgba(155, 35, 129, 0.4);
            border-radius: 999px;
          }

          #message.is-overflowing::-webkit-scrollbar-thumb:hover {
            background: rgba(155, 35, 129, 0.55);
          }

          /* Chromium/WebKit: remove stepper arrows (legacy scrollbar buttons) */
          #message::-webkit-scrollbar-button,
          #message::-webkit-scrollbar-button:single-button,
          #message::-webkit-scrollbar-button:double-button,
          #message::-webkit-scrollbar-button:start:decrement,
          #message::-webkit-scrollbar-button:end:increment,
          #message::-webkit-scrollbar-button:vertical:start:decrement,
          #message::-webkit-scrollbar-button:vertical:end:increment {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
            appearance: none;
          }

          #message::placeholder {
            color: var(--muted);
            font-weight: 400;
            opacity: 0.92;
          }

          #sendBtn {
            box-sizing: border-box;
            position: relative;
            z-index: 3;
            width: 38px;
            height: 38px;
            margin: 0;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: none;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.92);
            pointer-events: none;
            background: var(--c-plum);
            color: var(--c-highlight);
            box-shadow:
              0 1px 4px rgba(50, 11, 50, 0.18),
              inset 0 1px 0 rgba(234, 211, 218, 0.18);
            transition:
              opacity 0.2s ease,
              visibility 0.2s ease,
              transform 0.2s cubic-bezier(0.25, 0.46, 0.45, 0.94),
              background 0.15s ease,
              box-shadow 0.15s ease;
          }

          .input-shell.has-text #sendBtn {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
            pointer-events: auto;
            overflow: visible;
          }

          .input-shell.has-text #sendBtn:hover:not(:disabled) {
            background: var(--c-purple);
            box-shadow:
              0 0 0 1px rgba(210, 120, 137, 0.3),
              0 3px 14px rgba(155, 35, 129, 0.35),
              0 0 24px rgba(210, 120, 137, 0.22),
              inset 0 1px 0 rgba(255, 255, 255, 0.18);
          }

          .input-shell.has-text #sendBtn:active:not(:disabled) {
            transform: scale(0.96);
          }

          .input-shell.has-text #sendBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: rgba(50, 11, 50, 0.35);
            color: rgba(234, 211, 218, 0.65);
          }

          #sendBtn .send-arrow-char {
            font-family: var(--font-ui), "Segoe UI Symbol", "Noto Sans", sans-serif;
            font-size: 1.28rem;
            font-weight: 550;
            line-height: 1;
            display: block;
          }

          .hint {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 6px;
            padding-left: 14px;
          }

          .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: clamp(32px, 10vh, 72px) 20px;
            font-size: 0.93rem;
            line-height: 1.58;
            max-width: 28rem;
            margin: 0 auto;
          }

          .empty-state .empty-kicker {
            font-size: 1.35rem;
            font-weight: 650;
            letter-spacing: -0.03em;
            color: var(--c-purple);
            margin: 0 0 10px;
          }

          .empty-state .empty-sub {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
          }

          .sidebar-scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(50, 11, 50, 0.35);
            z-index: 25;
          }

          .sidebar-scrim.show { display: block; }

          @media (min-width: 881px) {
            #btnSidebarClose {
              display: none;
            }
            .sidebar-toolbar {
              justify-content: flex-end;
            }
          }

          @media (max-width: 880px) {
            #btnMenu { display: inline-flex; }
            .sidebar {
              position: fixed;
              left: 0;
              top: 0;
              bottom: 0;
              transform: translateX(-102%);
              box-shadow: 8px 0 28px rgba(50, 11, 50, 0.18);
            }
            .sidebar.open { transform: translateX(0); }
            .model-pill { display: none; }
          }
        </style>
    </head>

    <body>
      <div class="layout">
        <aside class="sidebar" id="sidebar" aria-label="Chats">
          <div class="sidebar-toolbar">
            <button type="button" class="icon-plain" id="btnSidebarClose" aria-label="Close menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <button type="button" class="icon-plain" id="btnToggleSearch" aria-label="Search chats">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3" stroke-linecap="round"/></svg>
            </button>
          </div>
          <button type="button" class="link-new-chat" id="btnNewChat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            New chat
          </button>
          <div id="sidebarSearchPanel" class="sidebar-search-panel">
            <input type="search" id="chatSearch" placeholder="Search chats" autocomplete="off" />
          </div>
          <h2 class="sidebar-heading">Chats</h2>
          <div class="sidebar-list-scroll" id="sidebarList"></div>
        </aside>

        <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>

        <div class="main">
          <header class="app-header">
            <div class="header-left">
              <button type="button" class="icon-plain" id="btnMenu" aria-label="Open chat list">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
              <div class="brand">
                <h1><span class="brand-wordmark">KAI</span></h1>
                <p class="subtitle" id="headerSubtitle">Cluster read-only agent</p>
              </div>
            </div>
            <div class="model-pill" id="modelPill" title="LLM from agent-controller">Loading model…</div>
          </header>

          <div class="messages-scroll" id="messagesScroll">
            <div class="messages-inner" id="chat" role="log" aria-live="polite" aria-relevant="additions">
              <div class="empty-state" id="emptyState">
                <p class="empty-kicker">Good to see you</p>
                <p class="empty-sub">Ask anything about the cluster—workloads, GitOps, cost, or health.</p>
              </div>
            </div>
          </div>

          <div class="composer">
            <div class="composer-inner">
              <div class="input-aurora">
                <svg class="input-neon-ring" viewBox="0 0 500 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
                  <defs>
                    <filter id="inputNeonBlur" x="-50%" y="-50%" width="200%" height="200%">
                      <feGaussianBlur in="SourceGraphic" stdDeviation="5.5" result="b"/>
                      <feGaussianBlur in="b" stdDeviation="2.2" result="b2"/>
                      <feMerge>
                        <feMergeNode in="b2"/>
                      </feMerge>
                    </filter>
                    <linearGradient id="inputChromaticTunnel" x1="0" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#320B32"/>
                      <stop offset="10%" stop-color="#9B2381"/>
                      <stop offset="22%" stop-color="#D27889"/>
                      <stop offset="34%" stop-color="#DC0814"/>
                      <stop offset="46%" stop-color="#EAD3DA"/>
                      <stop offset="58%" stop-color="#D27889"/>
                      <stop offset="70%" stop-color="#9B2381"/>
                      <stop offset="82%" stop-color="#DC0814"/>
                      <stop offset="94%" stop-color="#320B32"/>
                      <stop offset="100%" stop-color="#320B32"/>
                      <animateTransform attributeName="gradientTransform" type="rotate" from="0 250 50" to="360 250 50" dur="3.2s" repeatCount="indefinite"/>
                    </linearGradient>
                    <linearGradient id="inputChromaticTunnelB" x1="0" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#EAD3DA" stop-opacity="0.95"/>
                      <stop offset="20%" stop-color="#D27889"/>
                      <stop offset="40%" stop-color="#9B2381"/>
                      <stop offset="58%" stop-color="#DC0814"/>
                      <stop offset="78%" stop-color="#320B32"/>
                      <stop offset="100%" stop-color="#EAD3DA" stop-opacity="0.95"/>
                      <animateTransform attributeName="gradientTransform" type="rotate" from="360 250 50" to="0 250 50" dur="2.6s" repeatCount="indefinite"/>
                    </linearGradient>
                    <linearGradient id="inputNeonSpark" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
                      <stop offset="0%" stop-color="#320B32" stop-opacity="0"/>
                      <stop offset="35%" stop-color="#EAD3DA" stop-opacity="0.95"/>
                      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.55"/>
                      <stop offset="65%" stop-color="#D27889"/>
                      <stop offset="100%" stop-color="#320B32" stop-opacity="0"/>
                      <animateTransform attributeName="gradientTransform" type="translate" additive="sum" values="-80,0;520,0;-80,0" keyTimes="0;0.85;1" dur="2s" repeatCount="indefinite"/>
                    </linearGradient>
                  </defs>
                  <rect x="2.5" y="2.5" width="495" height="95" rx="47.5" ry="47.5" fill="none" pathLength="100" stroke="url(#inputChromaticTunnel)" stroke-width="12" stroke-linecap="round" opacity="0.72" filter="url(#inputNeonBlur)"/>
                  <rect x="2.5" y="2.5" width="495" height="95" rx="47.5" ry="47.5" fill="none" pathLength="100" stroke="url(#inputChromaticTunnelB)" stroke-width="4.25" stroke-linecap="round" opacity="0.9"/>
                  <rect x="2.5" y="2.5" width="495" height="95" rx="47.5" ry="47.5" fill="none" pathLength="100" stroke="url(#inputChromaticTunnel)" stroke-width="2.25" stroke-linecap="round" opacity="0.88"/>
                  <rect x="2.5" y="2.5" width="495" height="95" rx="47.5" ry="47.5" fill="none" pathLength="100" stroke="url(#inputNeonSpark)" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="28 72" opacity="0.95">
                    <animate attributeName="stroke-dashoffset" values="0;100" dur="2.4s" repeatCount="indefinite"/>
                  </rect>
                </svg>
                <div class="input-shell">
                  <div class="composer-attachments" id="composerAttachments" hidden></div>
                  <div class="composer-row">
                    <div class="composer-attach-slot">
                      <input type="file" id="attachmentInput" class="composer-file-input" multiple tabindex="-1" aria-hidden="true" accept="image/*,.pdf,.txt,.md,.yaml,.yml,.json,.csv,.png,.jpg,.jpeg,.gif,.webp,.svg,application/pdf,*/*"/>
                      <div class="attach-menu-anchor">
                        <button type="button" class="attach-btn" id="attachBtn" title="Add attachment (Shift+click to clear all)" aria-haspopup="menu" aria-expanded="false" aria-controls="attachMenu" aria-label="Open attachment menu">
                          <span class="attach-badge" id="attachBadge" hidden aria-hidden="true">0</span>
                          <svg class="attach-plus-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5v11M6.5 12h11" fill="none" stroke="currentColor" stroke-width="1.45" stroke-linecap="round"/></svg>
                        </button>
                        <div class="attach-menu" id="attachMenu" role="menu" hidden>
                          <button type="button" class="attach-menu-item" id="attachMenuUpload" role="menuitem">
                            <span class="attach-menu-clip-wrap" aria-hidden="true">
                              <svg class="attach-menu-clip-svg" viewBox="0 0 24 24">
                                <path transform="translate(-4 0)" d="M16 7L16 17A3.5 3.5 0 0 1 9 17L9 9.5A2.5 2.5 0 0 1 14 9.5L14 16A1.5 1.5 0 0 1 11 16L11 11.25"/>
                              </svg>
                            </span>
                            <span class="attach-menu-label">Upload photos &amp; files</span>
                          </button>
                        </div>
                      </div>
                    </div>
                    <div class="composer-textarea-wrap">
                      <textarea id="message" rows="1" placeholder="Message the cluster agent…" autocomplete="off"></textarea>
                    </div>
                    <div class="composer-send-slot">
                      <button type="button" id="sendBtn" title="Send" aria-label="Send message" aria-hidden="true" tabindex="-1">
                        <span class="send-arrow-char" aria-hidden="true">&#8593;</span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <p class="hint">Enter to send · Shift+Enter for new line · + uploads · × on a chip removes · Shift+click + clears all</p>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var STORAGE_KEY = "kai-chat-sessions-v1";
          var chatEl = document.getElementById("chat");
          var messagesScroll = document.getElementById("messagesScroll");
          var messageInput = document.getElementById("message");
          var sendBtn = document.getElementById("sendBtn");
          var attachmentInput = document.getElementById("attachmentInput");
          var attachBtn = document.getElementById("attachBtn");
          var attachBadge = document.getElementById("attachBadge");
          var attachMenu = document.getElementById("attachMenu");
          var attachMenuUpload = document.getElementById("attachMenuUpload");
          var composerAttachmentsEl = document.getElementById("composerAttachments");
          var emptyState = document.getElementById("emptyState");
          var sidebarList = document.getElementById("sidebarList");
          var chatSearch = document.getElementById("chatSearch");
          var btnNewChat = document.getElementById("btnNewChat");
          var modelPill = document.getElementById("modelPill");
          var headerSubtitle = document.getElementById("headerSubtitle");
          var sidebar = document.getElementById("sidebar");
          var sidebarScrim = document.getElementById("sidebarScrim");
          var btnMenu = document.getElementById("btnMenu");
          var btnSidebarClose = document.getElementById("btnSidebarClose");
          var btnToggleSearch = document.getElementById("btnToggleSearch");
          var sidebarSearchPanel = document.getElementById("sidebarSearchPanel");

          var busy = false;
          var store = { version: 1, sessions: [], activeId: null };
          var modelLabel = "gemini";
          var apiBaseDisplay = "";
          var selectedFiles = [];
          /** parallel object URLs for image previews ("" if not image) */
          var attachmentUrlMap = [];

          function closeAttachMenu() {
            if (!attachMenu || !attachBtn) return;
            attachMenu.setAttribute("hidden", "hidden");
            attachBtn.setAttribute("aria-expanded", "false");
          }

          function openAttachMenu() {
            if (!attachMenu || !attachBtn) return;
            attachMenu.removeAttribute("hidden");
            attachBtn.setAttribute("aria-expanded", "true");
            if (attachMenuUpload) attachMenuUpload.focus();
          }

          function toggleAttachMenu() {
            if (!attachMenu) return;
            if (attachMenu.hasAttribute("hidden")) openAttachMenu();
            else closeAttachMenu();
          }

          function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text == null ? "" : String(text);
            return d.innerHTML;
          }

          function applyBoldFromEscaped(escapedLine) {
            return escapedLine.replace(
              /\*\*(.+?)\*\*/g,
              "<strong>$1</strong>"
            );
          }

          function markdownToAssistantHtml(raw) {
            var lines = String(raw).replace(/\r\n/g, "\n").split("\n");
            var out = [];
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line.trim() === "") {
                out.push('<div class="md-gap"></div>');
                continue;
              }
              var m;
              if ((m = /^###\s+(.+)$/.exec(line))) {
                out.push(
                  '<h4 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h4>"
                );
                continue;
              }
              if ((m = /^##\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^#\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^[-*]\s+(.+)$/.exec(line))) {
                out.push(
                  '<p class="md-li">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</p>"
                );
                continue;
              }
              out.push(
                '<p class="md-p">' +
                  applyBoldFromEscaped(escapeHtml(line)) +
                  "</p>"
              );
            }
            return out.join("");
          }

          function uid() {
            if (typeof crypto !== "undefined" && crypto.randomUUID) {
              return crypto.randomUUID();
            }
            return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
          }

          function loadStore() {
            try {
              var raw = localStorage.getItem(STORAGE_KEY);
              if (!raw) return;
              var parsed = JSON.parse(raw);
              if (parsed && parsed.version === 1 && Array.isArray(parsed.sessions)) {
                store = parsed;
              }
            } catch (e) {}
          }

          function saveStore() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
            } catch (e) {}
          }

          function activeSession() {
            if (!store.activeId) return null;
            for (var i = 0; i < store.sessions.length; i++) {
              if (store.sessions[i].id === store.activeId) {
                return store.sessions[i];
              }
            }
            return null;
          }

          function purgeStaleEmptySessions() {
            var aid = store.activeId;
            store.sessions = store.sessions.filter(function (s) {
              if (s.messages && s.messages.length > 0) return true;
              return s.id === aid;
            });
          }

          function titleFromFirstMessage(text) {
            var raw = String(text).replace(/\s+/g, " ").trim();
            if (!raw) return "Chat";
            var cut = raw.split(/[.!?]\s/)[0];
            var sentence = cut && cut.length < raw.length ? cut : raw;
            if (sentence.length > 56) {
              return sentence.slice(0, 54).replace(/\s+\S*$/, "") + "…";
            }
            return sentence;
          }

          function touchSession(sess) {
            sess.updatedAt = Date.now();
            store.sessions.sort(function (a, b) {
              return b.updatedAt - a.updatedAt;
            });
          }

          function ensureDraftSession() {
            if (activeSession()) return;
            var s = {
              id: uid(),
              title: "",
              updatedAt: Date.now(),
              messages: [],
            };
            store.sessions.unshift(s);
            store.activeId = s.id;
            saveStore();
          }

          function hideEmptyIfNeeded() {
            if (emptyState && emptyState.parentNode) emptyState.remove();
          }

          function scrollMessagesToEnd() {
            messagesScroll.scrollTop = messagesScroll.scrollHeight;
          }

          function findSession(id) {
            for (var i = 0; i < store.sessions.length; i++) {
              if (store.sessions[i].id === id) return store.sessions[i];
            }
            return null;
          }

          function updateModelUI() {
            var hostShort = "";
            if (apiBaseDisplay) {
              hostShort = apiBaseDisplay.replace(/^https:\/\//, "");
              if (hostShort.length > 44) {
                hostShort = hostShort.slice(0, 44) + "…";
              }
            }
            modelPill.innerHTML =
              '<span class="model-id">' +
              escapeHtml(modelLabel) +
              "</span>" +
              (hostShort
                ? ' <span style="opacity:.72">· ' +
                  escapeHtml(hostShort) +
                  "</span>"
                : "");

            headerSubtitle.innerHTML =
              'Powered by <code style="font-size:inherit;color:#9B2381">' +
              escapeHtml(modelLabel) +
              "</code> · read-only cluster tools";
          }

          function fetchModelMeta() {
            fetch("/chat", { method: "GET" })
              .then(function (r) {
                return r.json().catch(function () { return {}; });
              })
              .then(function (data) {
                if (data && data.model) {
                  modelLabel = String(data.model);
                  apiBaseDisplay = data.api_base_display
                    ? String(data.api_base_display)
                    : "";
                }
                updateModelUI();
              })
              .catch(function () {
                modelPill.textContent = "Model (offline)";
                headerSubtitle.textContent =
                  "Could not reach agent-controller metadata";
              });
          }

          function renderSidebarList() {
            var q = (chatSearch.value || "").trim().toLowerCase();
            sidebarList.innerHTML = "";

            var sessions = store.sessions.filter(function (s) {
              return s.messages && s.messages.length > 0;
            });

            sessions.sort(function (a, b) {
              return b.updatedAt - a.updatedAt;
            });

            if (q) {
              sessions = sessions.filter(function (s) {
                if (
                  String(s.title || "")
                    .toLowerCase()
                    .indexOf(q) >= 0
                ) {
                  return true;
                }
                var msgs = s.messages || [];
                for (var i = 0; i < msgs.length; i++) {
                  if (
                    String(msgs[i].text || "")
                      .toLowerCase()
                      .indexOf(q) >= 0
                  ) {
                    return true;
                  }
                }
                return false;
              });
            }

            if (sessions.length === 0) {
              var emp = document.createElement("div");
              emp.className = "sidebar-empty";
              emp.textContent = q
                ? "No chats match."
                : "No chats yet. Send a message to start.";
              sidebarList.appendChild(emp);
              return;
            }

            for (var j = 0; j < sessions.length; j++) {
              var sess = sessions[j];
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "sidebar-item" + (sess.id === store.activeId ? " active" : "");

              var t = document.createElement("span");
              t.className = "sidebar-item-title";
              t.textContent = sess.title || "Chat";

              btn.appendChild(t);
              btn.addEventListener(
                "click",
                function (id) {
                  return function () {
                    store.activeId = id;
                    saveStore();
                    renderSidebarList();
                    renderThread();
                    sidebar.classList.remove("open");
                    sidebarScrim.classList.remove("show");
                  };
                }(sess.id)
              );

              sidebarList.appendChild(btn);
            }
          }

          function clearDomMessages() {
            while (chatEl.firstChild) {
              chatEl.removeChild(chatEl.firstChild);
            }
          }

          function renderThread() {
            clearDomMessages();
            var sess = activeSession();
            if (!sess || !sess.messages.length) {
              chatEl.innerHTML =
                '<div class="empty-state" id="emptyState">' +
                '<p class="empty-kicker">Good to see you</p>' +
                '<p class="empty-sub">Ask anything about the cluster—workloads, GitOps, cost, or health.</p>' +
                "</div>";
              emptyState = document.getElementById("emptyState");
              scrollMessagesToEnd();
              renderSidebarList();
              return;
            }

            hideEmptyIfNeeded();

            var msgs = sess.messages;
            for (var i = 0; i < msgs.length; i++) {
              var mrow = msgs[i];
              appendMessageRowDom(mrow.role, mrow.text, mrow.isError);
            }

            scrollMessagesToEnd();
            renderSidebarList();
          }

          function appendMessageRowDom(role, text, isError) {
            hideEmptyIfNeeded();

            var row = document.createElement("div");
            row.className = "msg-msg " + role;

            var shell = document.createElement("div");
            shell.className = "bubble-shell";

            var bubble = document.createElement("div");
            bubble.className = "bubble";

            if (role === "user") {
              bubble.textContent = text;
            } else {
              bubble.classList.add("prose");
              if (isError) {
                bubble.classList.add("error");
                bubble.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
              } else {
                bubble.innerHTML = markdownToAssistantHtml(text);
              }
              shell.appendChild(bubble);
              row.appendChild(shell);
              chatEl.appendChild(row);
              scrollMessagesToEnd();
              return;
            }

            shell.appendChild(bubble);
            row.appendChild(shell);
            chatEl.appendChild(row);
            scrollMessagesToEnd();
          }

          function showTypingBubble() {
            hideEmptyIfNeeded();
            var row = document.createElement("div");
            row.className = "msg-msg assistant";
            row.setAttribute("data-typing", "1");

            var shell = document.createElement("div");
            shell.className = "bubble-shell";

            var bubble = document.createElement("div");
            bubble.className = "bubble prose";
            var wrap = document.createElement("span");
            wrap.className = "typing-dot";
            wrap.setAttribute("aria-label", "Generating");
            for (var i = 0; i < 3; i++) {
              wrap.appendChild(document.createElement("span"));
            }
            bubble.appendChild(wrap);

            shell.appendChild(bubble);
            row.appendChild(shell);
            chatEl.appendChild(row);
            scrollMessagesToEnd();
            return row;
          }

          function removeTypingRow(row) {
            if (row && row.parentNode) row.parentNode.removeChild(row);
          }

          function syncAttachmentUi() {
            var n = selectedFiles.length;
            var shell = messageInput && messageInput.closest(".input-shell");
            if (shell) {
              if (n) shell.classList.add("has-attached");
              else shell.classList.remove("has-attached");
            }
            if (!attachBadge) {
              renderComposerAttachments();
              return;
            }
            if (n < 1) {
              attachBadge.setAttribute("hidden", "hidden");
              if (attachBtn) attachBtn.classList.remove("has-files");
            } else {
              attachBadge.removeAttribute("hidden");
              attachBadge.textContent = n > 9 ? "9+" : String(n);
              if (attachBtn) attachBtn.classList.add("has-files");
            }
            renderComposerAttachments();
          }

          function renderComposerAttachments() {
            if (!composerAttachmentsEl) return;
            while (composerAttachmentsEl.firstChild) {
              composerAttachmentsEl.removeChild(composerAttachmentsEl.firstChild);
            }
            if (selectedFiles.length < 1) {
              composerAttachmentsEl.classList.remove("has-items");
              composerAttachmentsEl.setAttribute("hidden", "hidden");
              return;
            }
            composerAttachmentsEl.removeAttribute("hidden");
            composerAttachmentsEl.classList.add("has-items");
            var i;
            for (i = 0; i < selectedFiles.length; i++) {
              (function (idx) {
                var file = selectedFiles[idx];
                var chip = document.createElement("div");
                chip.className = "compose-att-chip";
                var thumbUrl = attachmentUrlMap[idx];
                if (thumbUrl) {
                  var tw = document.createElement("div");
                  tw.className = "compose-att-thumb-wrap";
                  var img = document.createElement("img");
                  img.className = "compose-att-thumb";
                  img.alt = "";
                  img.loading = "lazy";
                  img.src = thumbUrl;
                  tw.appendChild(img);
                  chip.appendChild(tw);
                } else {
                  var dot = document.createElement("div");
                  dot.className = "compose-att-file-dot";
                  var base = file.name.replace(/^.*\./, "");
                  dot.textContent = base ? base.slice(0, 2).toUpperCase() : "–";
                  chip.appendChild(dot);
                }
                var nameEl = document.createElement("span");
                nameEl.className = "compose-att-name";
                nameEl.textContent = file.name;
                nameEl.title = file.name;
                chip.appendChild(nameEl);
                var rm = document.createElement("button");
                rm.type = "button";
                rm.className = "compose-att-remove";
                rm.setAttribute("data-idx", String(idx));
                rm.setAttribute("aria-label", "Remove " + file.name);
                rm.innerHTML =
                  '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>';
                chip.appendChild(rm);
                composerAttachmentsEl.appendChild(chip);
              })(i);
            }
          }

          function removeAttachmentAt(idx) {
            if (idx < 0 || idx >= selectedFiles.length) return;
            if (attachmentUrlMap[idx]) {
              URL.revokeObjectURL(attachmentUrlMap[idx]);
            }
            selectedFiles.splice(idx, 1);
            attachmentUrlMap.splice(idx, 1);
            syncAttachmentUi();
            syncSendArrow();
          }

          function clearAttachments() {
            var i;
            for (i = 0; i < attachmentUrlMap.length; i++) {
              if (attachmentUrlMap[i]) URL.revokeObjectURL(attachmentUrlMap[i]);
            }
            attachmentUrlMap = [];
            selectedFiles = [];
            syncAttachmentUi();
          }

          var TA_MIN_H = 40;
          var TA_MAX_H = 200;

          function autoResize() {
            var el = messageInput;
            el.style.height = "auto";
            var sh = el.scrollHeight;
            var target = Math.max(TA_MIN_H, Math.min(sh, TA_MAX_H));
            el.style.height = target + "px";
            if (sh > TA_MAX_H) {
              el.classList.add("is-overflowing");
            } else {
              el.classList.remove("is-overflowing");
            }
          }

          function syncSendArrow() {
            var shell = messageInput.closest(".input-shell");
            if (!shell) return;
            var showSend =
              messageInput.value.trim().length > 0 || selectedFiles.length > 0;
            if (showSend) {
              shell.classList.add("has-text");
              sendBtn.removeAttribute("aria-hidden");
              sendBtn.setAttribute("tabindex", "0");
            } else {
              shell.classList.remove("has-text");
              sendBtn.setAttribute("aria-hidden", "true");
              sendBtn.setAttribute("tabindex", "-1");
            }
          }

          function startNewChat() {
            store.sessions = store.sessions.filter(function (s) {
              return s.messages && s.messages.length > 0;
            });
            var s = {
              id: uid(),
              title: "",
              updatedAt: Date.now(),
              messages: [],
            };
            store.sessions.unshift(s);
            store.activeId = s.id;
            saveStore();
            renderSidebarList();
            renderThread();
            messageInput.focus();
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          }

          function appendToStore(role, text, isError) {
            var sess = activeSession();
            if (!sess) return;
            sess.messages.push({
              role: role,
              text: text,
              isError: !!isError,
            });
            if (role === "user") {
              var uc = 0;
              for (var i = 0; i < sess.messages.length; i++) {
                if (sess.messages[i].role === "user") uc++;
              }
              if (uc === 1) {
                sess.title = titleFromFirstMessage(text);
              }
            }
            touchSession(sess);
            saveStore();
            renderSidebarList();
          }

          async function sendMessage() {
            var message = messageInput.value;
            if (
              (!message.trim() && selectedFiles.length === 0) ||
              busy
            ) {
              return;
            }

            var names = [];
            var i;
            for (i = 0; i < selectedFiles.length; i++) {
              names.push(selectedFiles[i].name);
            }
            var attachHeader =
              names.length > 0
                ? "[Attached file(s): " +
                  names.join(", ") +
                  "]\n\n"
                : "";
            var outbound = attachHeader + message;

            busy = true;
            sendBtn.disabled = true;

            ensureDraftSession();
            appendToStore("user", outbound, false);
            appendMessageRowDom("user", outbound, false);
            messageInput.value = "";
            clearAttachments();
            autoResize();
            syncSendArrow();

            var typingRow = showTypingBubble();

            try {
              var response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: outbound }),
              });

              var data;
              try {
                data = await response.json();
              } catch (e) {
                data = { error: "Invalid response from server (not JSON)." };
              }

              removeTypingRow(typingRow);

              var aiText =
                data && (data.response != null ? data.response : data.error);
              if (aiText == null || aiText === "") {
                aiText = "No response returned";
              }

              var err = !response.ok;
              var textOut =
                typeof aiText === "string" ? aiText : String(aiText);
              if (err && response.status) {
                textOut += " (HTTP " + response.status + ")";
              }

              appendToStore("assistant", textOut, err);
              appendMessageRowDom("assistant", textOut, err);
            } catch (error) {
              removeTypingRow(typingRow);
              var emsg = String(error);
              appendToStore("assistant", emsg, true);
              appendMessageRowDom("assistant", emsg, true);
            } finally {
              busy = false;
              sendBtn.disabled = false;
              messageInput.focus();
            }
          }

          messageInput.addEventListener("input", function () {
            autoResize();
            syncSendArrow();
          });

          sendBtn.addEventListener("click", sendMessage);

          if (attachBtn && attachmentInput) {
            attachBtn.addEventListener("click", function (e) {
              if (e.shiftKey && selectedFiles.length) {
                e.preventDefault();
                e.stopPropagation();
                closeAttachMenu();
                clearAttachments();
                syncSendArrow();
                return;
              }
              e.preventDefault();
              e.stopPropagation();
              toggleAttachMenu();
            });

            document.addEventListener("click", function (e) {
              if (!attachMenu || attachMenu.hasAttribute("hidden")) return;
              if (attachBtn && attachBtn.contains(e.target)) return;
              if (attachMenu.contains(e.target)) return;
              closeAttachMenu();
            });

            document.addEventListener("keydown", function (e) {
              if (e.key !== "Escape") return;
              if (!attachMenu || attachMenu.hasAttribute("hidden")) return;
              e.preventDefault();
              closeAttachMenu();
              attachBtn.focus();
            });

            if (attachMenuUpload) {
              attachMenuUpload.addEventListener("click", function (e) {
                e.preventDefault();
                e.stopPropagation();
                closeAttachMenu();
                attachmentInput.click();
              });
            }

            attachmentInput.addEventListener("change", function () {
              var files = attachmentInput.files;
              if (!files || !files.length) return;
              for (var fi = 0; fi < files.length; fi++) {
                var f = files[fi];
                selectedFiles.push(f);
                if (f.type && f.type.indexOf("image/") === 0) {
                  attachmentUrlMap.push(URL.createObjectURL(f));
                } else {
                  attachmentUrlMap.push("");
                }
              }
              attachmentInput.value = "";
              syncAttachmentUi();
              syncSendArrow();
            });

            if (composerAttachmentsEl) {
              composerAttachmentsEl.addEventListener("click", function (e) {
                var rm = e.target.closest(".compose-att-remove");
                if (!rm || !composerAttachmentsEl.contains(rm)) return;
                var idx = parseInt(rm.getAttribute("data-idx"), 10);
                if (!isNaN(idx)) removeAttachmentAt(idx);
              });
            }
          }

          messageInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });

          btnNewChat.addEventListener("click", startNewChat);

          chatSearch.addEventListener("input", renderSidebarList);

          btnMenu.addEventListener("click", function () {
            sidebar.classList.toggle("open");
            sidebarScrim.classList.toggle("show");
          });

          sidebarScrim.addEventListener("click", function () {
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          });

          loadStore();
          purgeStaleEmptySessions();
          if (!findSession(store.activeId)) {
            store.activeId = null;
            var withMsg = store.sessions.filter(function (s) {
              return s.messages && s.messages.length > 0;
            });
            if (withMsg.length) {
              withMsg.sort(function (a, b) {
                return b.updatedAt - a.updatedAt;
              });
              store.activeId = withMsg[0].id;
            }
            saveStore();
          }

          renderSidebarList();
          renderThread();
          fetchModelMeta();
          syncAttachmentUi();
          syncSendArrow();
          autoResize();
          messageInput.focus();

          btnToggleSearch.addEventListener("click", function () {
            sidebarSearchPanel.classList.toggle("open");
            if (sidebarSearchPanel.classList.contains("open")) {
              chatSearch.focus();
            }
          });

          btnSidebarClose.addEventListener("click", function () {
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          });
        })();
      </script>
    </body>
    </html>
