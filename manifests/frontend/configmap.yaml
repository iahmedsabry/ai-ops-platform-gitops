apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
        <title>K8s AI Ops Chat</title>
        <style>
            body { font-family: Arial; max-width: 800px; margin: 40px auto; }
            #chat { border: 1px solid #ccc; padding: 15px; height: 400px; overflow-y: auto; }
            .user { color: blue; margin-bottom: 10px; }
            .ai { color: green; margin-bottom: 20px; }
            textarea { width: 100%; height: 60px; }
            button { padding: 10px; margin-top: 10px; }
        </style>
    </head>
    <body>

    <h2>K8s AI Ops Chat</h2>

    <div id="chat"></div>

    <textarea id="message" placeholder="Ask something..."></textarea>
    <button onclick="sendMessage()">Send</button>

    <script>
    async function sendMessage() {
        const messageInput = document.getElementById("message");
        const chat = document.getElementById("chat");

        const message = messageInput.value;
        if (!message) return;

        chat.innerHTML += `<div class="user"><b>You:</b> ${message}</div>`;
        messageInput.value = "";

        try {
            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
            });

            const data = await response.json();

            chat.innerHTML += `
                <div class="ai">
                    <b>AI:</b><br>${data.analysis || data.error}
                </div>
            `;

            chat.scrollTop = chat.scrollHeight;

        } catch (error) {
            chat.innerHTML += `<div class="ai"><b>Error:</b> ${error}</div>`;
        }
    }
    </script>

    </body>
    </html>