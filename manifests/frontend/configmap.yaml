apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>

        <!-- Base path because frontend is served under /aiops -->
        <base href="/aiops/">

        <title>AI Ops Chat</title>

        <style>
            body {
                font-family: Arial;
                max-width: 1000px;
                margin: 40px auto;
                padding: 20px;
            }

            h2 {
                margin-bottom: 20px;
            }

            #chat {
                border: 1px solid #ccc;
                padding: 15px;
                height: 500px;
                overflow-y: auto;
                background: #fafafa;
            }

            .user {
                color: blue;
                margin-bottom: 15px;
            }

            .ai {
                color: green;
                margin-bottom: 25px;
                white-space: pre-wrap;
            }

            textarea {
                width: 100%;
                height: 80px;
                margin-top: 20px;
                padding: 10px;
                font-size: 14px;
            }

            button {
                padding: 10px 20px;
                margin-top: 10px;
                cursor: pointer;
            }

            .loading {
                color: gray;
                font-style: italic;
                margin-top: 10px;
            }
        </style>

    </head>

    <body>

        <h2>AI Ops Chat</h2>

        <div id="chat"></div>

        <textarea
            id="message"
            placeholder="Ask something about the cluster..."
        ></textarea>

        <br>

        <button onclick="sendMessage()">
            Send
        </button>

        <script>

        async function sendMessage() {

            const messageInput = document.getElementById("message");
            const chat = document.getElementById("chat");

            const message = messageInput.value;

            // Ignore empty messages
            if (!message.trim()) {
                return;
            }

            // Show user message
            chat.innerHTML += `
                <div class="user">
                    <b>You:</b><br>
                    ${message}
                </div>
            `;

            // Clear input
            messageInput.value = "";

            // Temporary loading message
            const loadingId = "loading-" + Date.now();

            chat.innerHTML += `
                <div id="${loadingId}" class="loading">
                    AI is investigating the cluster...
                </div>
            `;

            // Auto-scroll
            chat.scrollTop = chat.scrollHeight;

            try {

                // Send request to backend
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: message
                    })
                });

                // Parse JSON response
                const data = await response.json();

                // Remove loading message
                document.getElementById(loadingId)?.remove();

                // Build final response text
                const aiResponse =
                    data.response ||
                    data.error ||
                    "No response returned";

                // Show AI response
                chat.innerHTML += `
                    <div class="ai">
                        <b>AI:</b><br>
                        ${aiResponse}
                    </div>
                `;

                // Auto-scroll
                chat.scrollTop = chat.scrollHeight;

            } catch (error) {

                // Remove loading message
                document.getElementById(loadingId)?.remove();

                // Show error
                chat.innerHTML += `
                    <div class="ai">
                        <b>Error:</b><br>
                        ${error}
                    </div>
                `;

                chat.scrollTop = chat.scrollHeight;
            }
        }

        </script>

    </body>
    </html>