apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#07090e">

        <base href="/k8s-ops-chat/">

        <title>K8s Ops Chat</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

        <style>
          :root {
            color-scheme: dark;
            --bg-main: #121212;
            --bg-sidebar: #1a1a1a;
            --bg-input: #1e1e1e;
            --bg-input-top: #262a33;
            --bg-input-bottom: #1c1f27;
            --input-border: rgba(255,255,255,.1);
            --input-ring: rgba(99, 140, 248, 0.22);
            --border-hair: rgba(255,255,255,.06);
            --text: #ececec;
            --text-dim: #b9bcc4;
            --muted: #8b909a;
            --sidebar-w: 280px;
            --danger-bg: rgba(120,30,30,.38);
            --danger-text: #fecaca;
            --danger-br: rgba(251,113,133,.32);
            --font-ui: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-family: var(--font-ui);
            font-feature-settings: "cv02", "cv11", "ss01";
          }

          * { box-sizing: border-box; }

          html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg-main);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            font-family: var(--font-ui);
          }

          body { background: var(--bg-main); }

          button {
            font: inherit;
            cursor: pointer;
          }

          .icon-plain {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            padding: 0;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text);
            opacity: 0.92;
          }

          .icon-plain:hover {
            opacity: 1;
            background: rgba(255,255,255,.05);
          }

          .icon-plain svg {
            stroke: currentColor;
            fill: none;
          }

          .layout {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
          }

          /* Sidebar */
          .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-hair);
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 30;
          }

          .sidebar-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 10px 6px;
          }

          .link-new-chat {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px 12px;
            border: none;
            background: transparent;
            color: var(--text-dim);
            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;
          }

          .link-new-chat:hover {
            color: var(--text);
          }

          .link-new-chat svg {
            stroke: currentColor;
            flex-shrink: 0;
            opacity: 0.9;
          }

          .sidebar-search-panel {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height .2s ease, opacity .15s ease;
            padding: 0 12px;
          }

          .sidebar-search-panel.open {
            max-height: 56px;
            opacity: 1;
            padding: 4px 12px 10px;
          }

          #chatSearch {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-hair);
            background: rgba(0,0,0,.25);
            color: var(--text);
            font-size: 0.84rem;
            outline: none;
          }

          #chatSearch:focus {
            border-color: rgba(255,255,255,.12);
          }

          #chatSearch::placeholder {
            color: var(--muted);
          }

          .sidebar-heading {
            margin: 6px 0 0;
            padding: 8px 14px 6px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--text);
          }

          .sidebar-list-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 4px 8px 16px;
            scrollbar-color: rgba(255,255,255,.12) transparent;
          }

          .sidebar-item {
            display: block;
            width: 100%;
            padding: 9px 10px;
            margin-bottom: 2px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-dim);
            text-align: left;
            transition: color .12s;
          }

          .sidebar-item:hover {
            color: var(--text);
          }

          .sidebar-item.active {
            color: var(--text);
            font-weight: 550;
          }

          .sidebar-item-title {
            font-size: 0.84rem;
            font-weight: inherit;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }

          .sidebar-empty {
            padding: 16px 14px;
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.45;
          }

          /* Main */
          .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--bg-main);
          }

          header.app-header {
            flex-shrink: 0;
            padding: 9px clamp(12px, 2.5vw, 22px);
            border-bottom: 1px solid var(--border-hair);
            background: var(--bg-main);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          }

          .header-left {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
          }

          #btnMenu {
            display: none;
            width: 36px;
            height: 36px;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text);
          }

          #btnMenu:hover {
            background: rgba(255,255,255,.06);
          }

          .brand h1 {
            font-size: 0.98rem;
            font-weight: 630;
            margin: 0;
            letter-spacing: -0.02em;
            color: var(--text);
          }

          .brand .subtitle {
            font-size: 0.7rem;
            color: var(--muted);
            margin: 2px 0 0;
            line-height: 1.4;
          }

          .model-pill {
            flex-shrink: 0;
            max-width: min(420px, 46vw);
            padding: 0;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--muted);
            background: transparent;
            border: none;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .model-pill .model-id {
            color: var(--text-dim);
          }

          .messages-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-color: rgba(255,255,255,.12) transparent;
          }

          .messages-inner {
            max-width: 820px;
            margin: 0 auto;
            padding: clamp(12px, 2vw, 20px)
              clamp(14px, 3vw, 28px)
              18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
          }

          .msg-msg {
            display: flex;
            flex-direction: column;
            animation: rise .28s ease;
          }

          @keyframes rise {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
          }

          .msg-msg.user { align-self: flex-end; max-width: min(560px, 92%); }
          .msg-msg.assistant { align-self: flex-start; max-width: min(720px, 96%); }

          .bubble-shell { width: 100%; }

          .bubble {
            border-radius: 12px;
            padding: 11px 14px;
            line-height: 1.5;
            font-size: 0.9rem;
            word-break: break-word;
            border: 1px solid var(--border-hair);
          }

          .msg-msg.user .bubble {
            background: rgba(255,255,255,.06);
            border-color: rgba(255,255,255,.08);
            white-space: pre-wrap;
          }

          .msg-msg.assistant .bubble {
            background: rgba(255,255,255,.04);
          }

          .bubble.error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-br);
          }

          .bubble.prose h3.md-heading {
            margin: 0 0 0.4em;
            font-size: 1.02rem;
            font-weight: 650;
          }

          .bubble.prose h4.md-heading {
            margin: 0.85em 0 0.35em;
            font-size: 0.9rem;
            font-weight: 640;
            color: #c8cdd5;
          }

          .bubble.prose h3.md-heading:first-child,
          .bubble.prose h4.md-heading:first-child { margin-top: 0; }

          .bubble.prose p.md-p {
            margin: 0.38em 0;
            white-space: pre-wrap;
          }

          .bubble.prose p.md-p:first-child { margin-top: 0; }
          .bubble.prose p.md-p:last-child { margin-bottom: 0; }

          .bubble.prose p.md-li {
            margin: 0.22em 0;
            padding-left: 1rem;
            position: relative;
            color: #d5d9e0;
          }

          .bubble.prose p.md-li::before {
            content: "";
            position: absolute;
            left: 2px;
            top: 0.62em;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,.45);
          }

          .bubble.prose strong { font-weight: 650; color: #fff; }
          .bubble.prose .md-gap { height: 0.5em; }

          .typing-dot {
            display: inline-flex;
            gap: 5px;
            padding: 4px 0;
          }

          .typing-dot span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.15s infinite ease-in-out;
          }

          .typing-dot span:nth-child(2) { animation-delay: 0.13s; }
          .typing-dot span:nth-child(3) { animation-delay: 0.26s; }

          @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.55); opacity: 0.42; }
            40% { transform: scale(1); opacity: 0.9; }
          }

          /* Composer */
          .composer {
            flex-shrink: 0;
            padding: 14px clamp(14px, 3vw, 22px)
              calc(14px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-hair);
            background: linear-gradient(
              180deg,
              rgba(18,18,18,.92) 0%,
              var(--bg-main) 100%
            );
          }

          .composer-inner {
            max-width: 820px;
            margin: 0 auto;
            overflow: visible;
          }

          /* Subtle blurred aurora glow + glass pill (slow drift, no harsh ring) */
          .input-aurora {
            position: relative;
            z-index: 0;
            width: 100%;
            padding: 3px;
            margin: 10px 2px 12px;
            border-radius: 9999px;
            overflow: visible;
          }

          .input-aurora::before,
          .input-aurora::after {
            content: "";
            position: absolute;
            pointer-events: none;
            border-radius: 9999px;
            z-index: 0;
          }

          .input-aurora::before {
            inset: -10px -6px -10px -6px;
            background:
              radial-gradient(
                ellipse 85% 70% at 28% 42%,
                rgba(99, 102, 241, 0.42) 0%,
                rgba(124, 58, 237, 0.22) 38%,
                transparent 68%
              ),
              radial-gradient(
                ellipse 75% 80% at 72% 58%,
                rgba(59, 130, 246, 0.28) 0%,
                rgba(139, 92, 246, 0.18) 45%,
                transparent 70%
              );
            filter: blur(28px);
            opacity: 0.88;
            will-change: transform, opacity;
            animation: aurora-drift-a 32s ease-in-out infinite;
          }

          .input-aurora::after {
            inset: -6px;
            background:
              radial-gradient(
                ellipse 60% 55% at 65% 35%,
                rgba(167, 139, 250, 0.35) 0%,
                transparent 58%
              ),
              radial-gradient(
                ellipse 70% 65% at 38% 68%,
                rgba(56, 189, 248, 0.2) 0%,
                transparent 62%
              );
            filter: blur(22px);
            opacity: 0.45;
            animation: aurora-drift-b 40s ease-in-out infinite;
          }

          @keyframes aurora-drift-a {
            0%, 100% {
              transform: translate(-2%, 1%) scale(1);
              opacity: 0.82;
            }
            33% {
              transform: translate(3%, -2%) scale(1.03);
              opacity: 0.95;
            }
            66% {
              transform: translate(1.5%, 2.5%) scale(0.98);
              opacity: 0.88;
            }
          }

          @keyframes aurora-drift-b {
            0%, 100% {
              transform: translate(2%, -1%) rotate(-2deg);
              opacity: 0.48;
            }
            50% {
              transform: translate(-3%, 2%) rotate(2deg);
              opacity: 0.62;
            }
          }

          @media (prefers-reduced-motion: reduce) {
            .input-aurora::before,
            .input-aurora::after {
              animation: none;
              transform: none;
            }
            .input-aurora::before { opacity: 0.75; }
            .input-aurora::after { opacity: 0.4; }
          }

          .input-shell {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(22, 24, 34, 0.42);
            -webkit-backdrop-filter: blur(18px) saturate(1.25);
            backdrop-filter: blur(18px) saturate(1.25);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            padding: 8px 14px 8px 20px;
            min-height: 52px;
            box-shadow:
              inset 0 1px 0 rgba(255, 255, 255, 0.14),
              inset 0 -1px 0 rgba(0, 0, 0, 0.18),
              0 8px 32px rgba(0, 0, 0, 0.38),
              0 2px 12px rgba(99, 102, 241, 0.1),
              0 0 48px rgba(79, 70, 229, 0.08);
            transition: box-shadow 0.28s ease, border-color 0.28s ease, background 0.28s ease;
          }

          .input-shell:focus-within {
            background: rgba(26, 28, 40, 0.52);
            border-color: rgba(165, 180, 252, 0.28);
            box-shadow:
              inset 0 1px 0 rgba(255, 255, 255, 0.16),
              inset 0 -1px 0 rgba(0, 0, 0, 0.2),
              0 10px 40px rgba(0, 0, 0, 0.42),
              0 4px 24px rgba(99, 102, 241, 0.16),
              0 0 56px rgba(129, 140, 248, 0.12);
          }

          #message {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 200px;
            padding: 11px 10px 11px 0;
            font-family: var(--font-ui);
            font-size: 0.9375rem;
            font-weight: 400;
            line-height: 1.55;
            letter-spacing: 0.01em;
            background: transparent;
            color: var(--text);
          }

          #message::placeholder {
            color: var(--muted);
            font-weight: 400;
            opacity: 0.92;
          }

          #sendBtn {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            margin-right: 2px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #111111;
            box-shadow: 0 1px 2px rgba(0,0,0,.12);
            transition: background 0.15s ease, transform 0.08s ease, box-shadow 0.15s ease;
          }

          #sendBtn:hover:not(:disabled) {
            background: #f0f0f0;
            box-shadow: 0 2px 6px rgba(0,0,0,.14);
          }

          #sendBtn:active:not(:disabled) {
            transform: scale(0.96);
          }

          #sendBtn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #e5e5e5;
          }

          #sendBtn svg {
            stroke: currentColor;
            fill: none;
          }

          .hint {
            font-size: 0.65rem;
            color: var(--muted);
            margin-top: 6px;
            padding-left: 14px;
          }

          .empty-state {
            text-align: center;
            color: var(--text-dim);
            padding: clamp(32px, 10vh, 72px) 20px;
            font-size: 0.93rem;
            line-height: 1.58;
            max-width: 28rem;
            margin: 0 auto;
          }

          .empty-state .empty-kicker {
            font-size: 1.35rem;
            font-weight: 650;
            letter-spacing: -0.03em;
            color: var(--text);
            margin: 0 0 10px;
          }

          .empty-state .empty-sub {
            margin: 0;
            color: var(--muted);
            font-size: 0.88rem;
          }

          .sidebar-scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.52);
            z-index: 25;
          }

          .sidebar-scrim.show { display: block; }

          @media (min-width: 881px) {
            #btnSidebarClose {
              display: none;
            }
            .sidebar-toolbar {
              justify-content: flex-end;
            }
          }

          @media (max-width: 880px) {
            #btnMenu { display: inline-flex; }
            .sidebar {
              position: fixed;
              left: 0;
              top: 0;
              bottom: 0;
              transform: translateX(-102%);
              box-shadow: 8px 0 32px rgba(0,0,0,.4);
            }
            .sidebar.open { transform: translateX(0); }
            .model-pill { display: none; }
          }
        </style>
    </head>

    <body>
      <div class="layout">
        <aside class="sidebar" id="sidebar" aria-label="Chats">
          <div class="sidebar-toolbar">
            <button type="button" class="icon-plain" id="btnSidebarClose" aria-label="Close menu">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <button type="button" class="icon-plain" id="btnToggleSearch" aria-label="Search chats">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3" stroke-linecap="round"/></svg>
            </button>
          </div>
          <button type="button" class="link-new-chat" id="btnNewChat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
            </svg>
            New chat
          </button>
          <div id="sidebarSearchPanel" class="sidebar-search-panel">
            <input type="search" id="chatSearch" placeholder="Search chats" autocomplete="off" />
          </div>
          <h2 class="sidebar-heading">Chats</h2>
          <div class="sidebar-list-scroll" id="sidebarList"></div>
        </aside>

        <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>

        <div class="main">
          <header class="app-header">
            <div class="header-left">
              <button type="button" class="icon-plain" id="btnMenu" aria-label="Open chat list">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
              <div class="brand">
                <h1>K8s Ops Chat</h1>
                <p class="subtitle" id="headerSubtitle">Cluster read-only agent</p>
              </div>
            </div>
            <div class="model-pill" id="modelPill" title="LLM from agent-controller">Loading model…</div>
          </header>

          <div class="messages-scroll" id="messagesScroll">
            <div class="messages-inner" id="chat" role="log" aria-live="polite" aria-relevant="additions">
              <div class="empty-state" id="emptyState">
                <p class="empty-kicker">Good to see you</p>
                <p class="empty-sub">Ask anything about the cluster—workloads, GitOps, cost, or health.</p>
              </div>
            </div>
          </div>

          <div class="composer">
            <div class="composer-inner">
              <div class="input-aurora">
                <div class="input-shell">
                  <textarea id="message" rows="1" placeholder="Message the cluster agent…" autocomplete="off"></textarea>
                  <button type="button" id="sendBtn" title="Send" aria-label="Send message">
                    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true" fill="none">
                      <line x1="12" y1="17.5" x2="12" y2="9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
                      <path d="M8 12.5L12 8.5l4 4" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                  </button>
                </div>
              </div>
              <p class="hint">Enter to send · Shift+Enter for a new line</p>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var STORAGE_KEY = "k8s-ops-chat-sessions-v1";
          var chatEl = document.getElementById("chat");
          var messagesScroll = document.getElementById("messagesScroll");
          var messageInput = document.getElementById("message");
          var sendBtn = document.getElementById("sendBtn");
          var emptyState = document.getElementById("emptyState");
          var sidebarList = document.getElementById("sidebarList");
          var chatSearch = document.getElementById("chatSearch");
          var btnNewChat = document.getElementById("btnNewChat");
          var modelPill = document.getElementById("modelPill");
          var headerSubtitle = document.getElementById("headerSubtitle");
          var sidebar = document.getElementById("sidebar");
          var sidebarScrim = document.getElementById("sidebarScrim");
          var btnMenu = document.getElementById("btnMenu");
          var btnSidebarClose = document.getElementById("btnSidebarClose");
          var btnToggleSearch = document.getElementById("btnToggleSearch");
          var sidebarSearchPanel = document.getElementById("sidebarSearchPanel");

          var busy = false;
          var store = { version: 1, sessions: [], activeId: null };
          var modelLabel = "gemini";
          var apiBaseDisplay = "";

          function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text == null ? "" : String(text);
            return d.innerHTML;
          }

          function applyBoldFromEscaped(escapedLine) {
            return escapedLine.replace(
              /\*\*(.+?)\*\*/g,
              "<strong>$1</strong>"
            );
          }

          function markdownToAssistantHtml(raw) {
            var lines = String(raw).replace(/\r\n/g, "\n").split("\n");
            var out = [];
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line.trim() === "") {
                out.push('<div class="md-gap"></div>');
                continue;
              }
              var m;
              if ((m = /^###\s+(.+)$/.exec(line))) {
                out.push(
                  '<h4 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h4>"
                );
                continue;
              }
              if ((m = /^##\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^#\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^[-*]\s+(.+)$/.exec(line))) {
                out.push(
                  '<p class="md-li">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</p>"
                );
                continue;
              }
              out.push(
                '<p class="md-p">' +
                  applyBoldFromEscaped(escapeHtml(line)) +
                  "</p>"
              );
            }
            return out.join("");
          }

          function uid() {
            if (typeof crypto !== "undefined" && crypto.randomUUID) {
              return crypto.randomUUID();
            }
            return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
          }

          function loadStore() {
            try {
              var raw = localStorage.getItem(STORAGE_KEY);
              if (!raw) return;
              var parsed = JSON.parse(raw);
              if (parsed && parsed.version === 1 && Array.isArray(parsed.sessions)) {
                store = parsed;
              }
            } catch (e) {}
          }

          function saveStore() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
            } catch (e) {}
          }

          function activeSession() {
            if (!store.activeId) return null;
            for (var i = 0; i < store.sessions.length; i++) {
              if (store.sessions[i].id === store.activeId) {
                return store.sessions[i];
              }
            }
            return null;
          }

          function purgeStaleEmptySessions() {
            var aid = store.activeId;
            store.sessions = store.sessions.filter(function (s) {
              if (s.messages && s.messages.length > 0) return true;
              return s.id === aid;
            });
          }

          function titleFromFirstMessage(text) {
            var raw = String(text).replace(/\s+/g, " ").trim();
            if (!raw) return "Chat";
            var cut = raw.split(/[.!?]\s/)[0];
            var sentence = cut && cut.length < raw.length ? cut : raw;
            if (sentence.length > 56) {
              return sentence.slice(0, 54).replace(/\s+\S*$/, "") + "…";
            }
            return sentence;
          }

          function touchSession(sess) {
            sess.updatedAt = Date.now();
            store.sessions.sort(function (a, b) {
              return b.updatedAt - a.updatedAt;
            });
          }

          function ensureDraftSession() {
            if (activeSession()) return;
            var s = {
              id: uid(),
              title: "",
              updatedAt: Date.now(),
              messages: [],
            };
            store.sessions.unshift(s);
            store.activeId = s.id;
            saveStore();
          }

          function hideEmptyIfNeeded() {
            if (emptyState && emptyState.parentNode) emptyState.remove();
          }

          function scrollMessagesToEnd() {
            messagesScroll.scrollTop = messagesScroll.scrollHeight;
          }

          function findSession(id) {
            for (var i = 0; i < store.sessions.length; i++) {
              if (store.sessions[i].id === id) return store.sessions[i];
            }
            return null;
          }

          function updateModelUI() {
            var hostShort = "";
            if (apiBaseDisplay) {
              hostShort = apiBaseDisplay.replace(/^https:\/\//, "");
              if (hostShort.length > 44) {
                hostShort = hostShort.slice(0, 44) + "…";
              }
            }
            modelPill.innerHTML =
              '<span class="model-id">' +
              escapeHtml(modelLabel) +
              "</span>" +
              (hostShort
                ? ' <span style="opacity:.72">· ' +
                  escapeHtml(hostShort) +
                  "</span>"
                : "");

            headerSubtitle.innerHTML =
              'Powered by <code style="font-size:inherit;color:rgba(154,174,216,.92)">' +
              escapeHtml(modelLabel) +
              "</code> · read-only cluster tools";
          }

          function fetchModelMeta() {
            fetch("/chat", { method: "GET" })
              .then(function (r) {
                return r.json().catch(function () { return {}; });
              })
              .then(function (data) {
                if (data && data.model) {
                  modelLabel = String(data.model);
                  apiBaseDisplay = data.api_base_display
                    ? String(data.api_base_display)
                    : "";
                }
                updateModelUI();
              })
              .catch(function () {
                modelPill.textContent = "Model (offline)";
                headerSubtitle.textContent =
                  "Could not reach agent-controller metadata";
              });
          }

          function renderSidebarList() {
            var q = (chatSearch.value || "").trim().toLowerCase();
            sidebarList.innerHTML = "";

            var sessions = store.sessions.filter(function (s) {
              return s.messages && s.messages.length > 0;
            });

            sessions.sort(function (a, b) {
              return b.updatedAt - a.updatedAt;
            });

            if (q) {
              sessions = sessions.filter(function (s) {
                if (
                  String(s.title || "")
                    .toLowerCase()
                    .indexOf(q) >= 0
                ) {
                  return true;
                }
                var msgs = s.messages || [];
                for (var i = 0; i < msgs.length; i++) {
                  if (
                    String(msgs[i].text || "")
                      .toLowerCase()
                      .indexOf(q) >= 0
                  ) {
                    return true;
                  }
                }
                return false;
              });
            }

            if (sessions.length === 0) {
              var emp = document.createElement("div");
              emp.className = "sidebar-empty";
              emp.textContent = q
                ? "No chats match."
                : "No chats yet. Send a message to start.";
              sidebarList.appendChild(emp);
              return;
            }

            for (var j = 0; j < sessions.length; j++) {
              var sess = sessions[j];
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "sidebar-item" + (sess.id === store.activeId ? " active" : "");

              var t = document.createElement("span");
              t.className = "sidebar-item-title";
              t.textContent = sess.title || "Chat";

              btn.appendChild(t);
              btn.addEventListener(
                "click",
                function (id) {
                  return function () {
                    store.activeId = id;
                    saveStore();
                    renderSidebarList();
                    renderThread();
                    sidebar.classList.remove("open");
                    sidebarScrim.classList.remove("show");
                  };
                }(sess.id)
              );

              sidebarList.appendChild(btn);
            }
          }

          function clearDomMessages() {
            while (chatEl.firstChild) {
              chatEl.removeChild(chatEl.firstChild);
            }
          }

          function renderThread() {
            clearDomMessages();
            var sess = activeSession();
            if (!sess || !sess.messages.length) {
              chatEl.innerHTML =
                '<div class="empty-state" id="emptyState">' +
                '<p class="empty-kicker">Good to see you</p>' +
                '<p class="empty-sub">Ask anything about the cluster—workloads, GitOps, cost, or health.</p>' +
                "</div>";
              emptyState = document.getElementById("emptyState");
              scrollMessagesToEnd();
              renderSidebarList();
              return;
            }

            hideEmptyIfNeeded();

            var msgs = sess.messages;
            for (var i = 0; i < msgs.length; i++) {
              var mrow = msgs[i];
              appendMessageRowDom(mrow.role, mrow.text, mrow.isError);
            }

            scrollMessagesToEnd();
            renderSidebarList();
          }

          function appendMessageRowDom(role, text, isError) {
            hideEmptyIfNeeded();

            var row = document.createElement("div");
            row.className = "msg-msg " + role;

            var shell = document.createElement("div");
            shell.className = "bubble-shell";

            var bubble = document.createElement("div");
            bubble.className = "bubble";

            if (role === "user") {
              bubble.textContent = text;
            } else {
              bubble.classList.add("prose");
              if (isError) {
                bubble.classList.add("error");
                bubble.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
              } else {
                bubble.innerHTML = markdownToAssistantHtml(text);
              }
              shell.appendChild(bubble);
              row.appendChild(shell);
              chatEl.appendChild(row);
              scrollMessagesToEnd();
              return;
            }

            shell.appendChild(bubble);
            row.appendChild(shell);
            chatEl.appendChild(row);
            scrollMessagesToEnd();
          }

          function showTypingBubble() {
            hideEmptyIfNeeded();
            var row = document.createElement("div");
            row.className = "msg-msg assistant";
            row.setAttribute("data-typing", "1");

            var shell = document.createElement("div");
            shell.className = "bubble-shell";

            var bubble = document.createElement("div");
            bubble.className = "bubble prose";
            var wrap = document.createElement("span");
            wrap.className = "typing-dot";
            wrap.setAttribute("aria-label", "Generating");
            for (var i = 0; i < 3; i++) {
              wrap.appendChild(document.createElement("span"));
            }
            bubble.appendChild(wrap);

            shell.appendChild(bubble);
            row.appendChild(shell);
            chatEl.appendChild(row);
            scrollMessagesToEnd();
            return row;
          }

          function removeTypingRow(row) {
            if (row && row.parentNode) row.parentNode.removeChild(row);
          }

          function autoResize() {
            messageInput.style.height = "auto";
            messageInput.style.height =
              Math.min(messageInput.scrollHeight, 200) + "px";
          }

          function startNewChat() {
            store.sessions = store.sessions.filter(function (s) {
              return s.messages && s.messages.length > 0;
            });
            var s = {
              id: uid(),
              title: "",
              updatedAt: Date.now(),
              messages: [],
            };
            store.sessions.unshift(s);
            store.activeId = s.id;
            saveStore();
            renderSidebarList();
            renderThread();
            messageInput.focus();
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          }

          function appendToStore(role, text, isError) {
            var sess = activeSession();
            if (!sess) return;
            sess.messages.push({
              role: role,
              text: text,
              isError: !!isError,
            });
            if (role === "user") {
              var uc = 0;
              for (var i = 0; i < sess.messages.length; i++) {
                if (sess.messages[i].role === "user") uc++;
              }
              if (uc === 1) {
                sess.title = titleFromFirstMessage(text);
              }
            }
            touchSession(sess);
            saveStore();
            renderSidebarList();
          }

          async function sendMessage() {
            var message = messageInput.value;
            if (!message.trim() || busy) return;

            busy = true;
            sendBtn.disabled = true;

            ensureDraftSession();
            appendToStore("user", message, false);
            appendMessageRowDom("user", message, false);
            messageInput.value = "";
            autoResize();

            var typingRow = showTypingBubble();

            try {
              var response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message }),
              });

              var data;
              try {
                data = await response.json();
              } catch (e) {
                data = { error: "Invalid response from server (not JSON)." };
              }

              removeTypingRow(typingRow);

              var aiText =
                data && (data.response != null ? data.response : data.error);
              if (aiText == null || aiText === "") {
                aiText = "No response returned";
              }

              var err = !response.ok;
              var textOut =
                typeof aiText === "string" ? aiText : String(aiText);
              if (err && response.status) {
                textOut += " (HTTP " + response.status + ")";
              }

              appendToStore("assistant", textOut, err);
              appendMessageRowDom("assistant", textOut, err);
            } catch (error) {
              removeTypingRow(typingRow);
              var emsg = String(error);
              appendToStore("assistant", emsg, true);
              appendMessageRowDom("assistant", emsg, true);
            } finally {
              busy = false;
              sendBtn.disabled = false;
              messageInput.focus();
            }
          }

          messageInput.addEventListener("input", autoResize);

          sendBtn.addEventListener("click", sendMessage);

          messageInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });

          btnNewChat.addEventListener("click", startNewChat);

          chatSearch.addEventListener("input", renderSidebarList);

          btnMenu.addEventListener("click", function () {
            sidebar.classList.toggle("open");
            sidebarScrim.classList.toggle("show");
          });

          sidebarScrim.addEventListener("click", function () {
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          });

          loadStore();
          purgeStaleEmptySessions();
          if (!findSession(store.activeId)) {
            store.activeId = null;
            var withMsg = store.sessions.filter(function (s) {
              return s.messages && s.messages.length > 0;
            });
            if (withMsg.length) {
              withMsg.sort(function (a, b) {
                return b.updatedAt - a.updatedAt;
              });
              store.activeId = withMsg[0].id;
            }
            saveStore();
          }

          renderSidebarList();
          renderThread();
          fetchModelMeta();
          messageInput.focus();

          btnToggleSearch.addEventListener("click", function () {
            sidebarSearchPanel.classList.toggle("open");
            if (sidebarSearchPanel.classList.contains("open")) {
              chatSearch.focus();
            }
          });

          btnSidebarClose.addEventListener("click", function () {
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          });
        })();
      </script>
    </body>
    </html>
