apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Base path: UI is served under /k8s-ops-chat (API remains POST /chat) -->
        <base href="/k8s-ops-chat/">

        <title>K8s Ops Chat</title>

        <style>
          :root {
            color-scheme: dark;
            --bg0: #07090e;
            --bg1: #0c1018;
            --header-bg: rgba(12,15,22,.92);
            --surface: #141a26;
            --surface-elev: #1a2230;
            --border: rgba(255,255,255,.07);
            --border-focus: rgba(79,142,252,.42);
            --text: #e6e9ef;
            --text-soft: #9ca3af;
            --muted: #6b7288;
            --accent: #4f8efc;
            --accent-dim: #3d6fcb;
            --accent-glow: rgba(79,142,252,.22);
            --user-bubble-start: #1a3a62;
            --user-bubble-end: #122540;
            --assistant-msg: rgba(26,34,46,.95);
            --danger-bg: rgba(127,29,29,.35);
            --danger-text: #fecaca;
            --danger-br: rgba(248,113,113,.35);
            --radius-xl: 20px;
            --radius-chat: 16px;
            --shadow-msg: 0 4px 24px rgba(0,0,0,.38);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          }

          * { box-sizing: border-box; }

          html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg0);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
          }

          body {
            background:
              radial-gradient(ellipse 100% 90% at 50% -30%, rgba(79,142,252,.13), transparent 55%),
              linear-gradient(180deg, var(--bg0), var(--bg1) 50%);
          }

          /* Full-viewport shell */
          .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            max-width: 100vw;
            margin: 0;
            min-height: 0;
          }

          header.app-header {
            flex-shrink: 0;
            z-index: 5;
            padding: 11px clamp(14px, 3.5vw, 32px);
            border-bottom: 1px solid var(--border);
            background: var(--header-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          }

          header.app-header h1 {
            font-size: 1rem;
            font-weight: 650;
            margin: 0;
            letter-spacing: -0.03em;
            background: linear-gradient(90deg, var(--text) 22%, rgba(79,142,252,.92));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
          }

          header .subtitle {
            font-size: 0.78rem;
            color: var(--text-soft);
            margin: 3px 0 0;
            line-height: 1.38;
          }

          .brand { max-width: 56rem; }

          .chat-scroll {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
          }

          #chat {
            flex: 1;
            width: min(940px, 100%);
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: clamp(14px, 2.5vw, 22px) clamp(14px, 3.5vw, 36px)
              clamp(120px, 18vh, 160px);
            display: flex;
            flex-direction: column;
            gap: 22px;
            scrollbar-color: rgba(255,255,255,.22) transparent;
          }

          #chat::-webkit-scrollbar { width: 8px; }
          #chat::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.15);
            border-radius: 8px;
          }

          .msg-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 100%;
            animation: fadeSlide 0.32s cubic-bezier(.22,1,.36,1);
          }

          @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
          }

          .msg-row.user { flex-direction: row-reverse; }

          .avatar {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            border: 1px solid var(--border);
          }

          .msg-row.user .avatar {
            background: linear-gradient(145deg, #2a4264, var(--surface));
            color: var(--text);
          }

          .msg-row.assistant .avatar {
            background: linear-gradient(145deg, #2b4cad, var(--accent));
            color: #fff;
            box-shadow: 0 6px 20px var(--accent-glow);
          }

          .bubble-wrap {
            max-width: min(90%, 720px);
            display: flex;
            flex-direction: column;
            gap: 6px;
          }

          .msg-row.user .bubble-wrap { align-items: flex-end; }
          .msg-row.assistant .bubble-wrap { align-items: flex-start; }

          .label {
            font-size: 0.62rem;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0 5px;
          }

          .bubble {
            padding: 14px 17px;
            border-radius: var(--radius-chat);
            line-height: 1.55;
            font-size: 0.9375rem;
            word-break: break-word;
            border: 1px solid var(--border);
            box-shadow: var(--shadow-msg);
          }

          .msg-row.user .bubble {
            background: linear-gradient(145deg, var(--user-bubble-start), var(--user-bubble-end));
            color: var(--text);
            border-color: rgba(79,142,252,.26);
            border-bottom-right-radius: 5px;
            white-space: pre-wrap;
          }

          .msg-row.assistant .bubble {
            background: var(--assistant-msg);
            color: var(--text);
            border-bottom-left-radius: 5px;
          }

          .bubble.prose { white-space: normal; }

          .bubble.error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-br);
          }

          .bubble.prose h3.md-heading {
            margin: 0 0 0.45em;
            font-size: 1.06rem;
            font-weight: 650;
            color: var(--text);
            letter-spacing: -0.02em;
            line-height: 1.3;
          }

          .bubble.prose h4.md-heading {
            margin: 1em 0 0.4em;
            font-size: 0.93rem;
            font-weight: 650;
            color: #cdd2dc;
          }

          .bubble.prose h3.md-heading:first-child,
          .bubble.prose h4.md-heading:first-child { margin-top: 0; }

          .bubble.prose p.md-p {
            margin: 0.45em 0;
            white-space: pre-wrap;
          }

          .bubble.prose p.md-p:first-child { margin-top: 0; }
          .bubble.prose p.md-p:last-child { margin-bottom: 0; }

          .bubble.prose p.md-li {
            margin: 0.28em 0;
            padding-left: 1.05rem;
            position: relative;
            color: #d9dde5;
          }

          .bubble.prose p.md-li::before {
            content: "";
            position: absolute;
            left: 3px;
            top: 0.68em;
            width: 5px;
            height: 5px;
            border-radius: 999px;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
          }

          .bubble.prose strong {
            font-weight: 650;
            color: #fff;
          }

          .bubble.prose .md-gap { height: 0.65em; }

          .composer {
            flex-shrink: 0;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 20;
            padding: 14px clamp(14px, 3.5vw, 32px)
              calc(14px + env(safe-area-inset-bottom));
            background: linear-gradient(to top,
              rgba(7,9,14,.94) 50%,
              rgba(7,9,14,.55) 88%,
              transparent);
          }

          .composer-inner {
            width: min(940px, 100%);
            margin: 0 auto;
          }

          .input-shell {
            display: flex;
            align-items: flex-end;
            gap: 11px;
            background: var(--surface-elev);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 12px;
            box-shadow:
              inset 0 1px rgba(255,255,255,.04),
              0 14px 40px rgba(0,0,0,.42);
          }

          .input-shell:focus-within {
            border-color: var(--border-focus);
            box-shadow:
              inset 0 1px rgba(255,255,255,.05),
              0 0 0 4px var(--accent-glow),
              0 14px 40px rgba(0,0,0,.42);
          }

          #message {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 200px;
            font: inherit;
            font-size: 0.95rem;
            line-height: 1.42;
            background: transparent;
            color: var(--text);
          }

          #message::placeholder {
            color: var(--muted);
          }

          #sendBtn {
            flex-shrink: 0;
            height: 41px;
            padding: 0 20px;
            border-radius: 11px;
            border: none;
            cursor: pointer;
            font-weight: 620;
            font-size: 0.84rem;
            color: #fff;
            background: linear-gradient(145deg, var(--accent), var(--accent-dim));
            box-shadow: 0 10px 28px var(--accent-glow);
            transition: opacity 0.15s ease, transform 0.08s ease;
          }

          #sendBtn:active:not(:disabled) {
            transform: scale(0.98);
          }

          #sendBtn:hover:not(:disabled) {
            filter: brightness(1.07);
          }

          #sendBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            filter: grayscale(0.3);
          }

          .hint {
            font-size: 0.7rem;
            color: var(--muted);
            margin-top: 8px;
            padding-left: 6px;
          }

          .typing {
            display: flex;
            gap: 6px;
            padding: 15px 17px;
            align-items: center;
          }

          .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.2s infinite ease-in-out;
          }

          .typing span:nth-child(2) { animation-delay: 0.15s; }
          .typing span:nth-child(3) { animation-delay: 0.3s; }

          @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 0.92; }
          }

          .empty-state {
            text-align: center;
            color: var(--text-soft);
            padding: clamp(28px, 8vh, 56px)
              clamp(18px, 4vw, 40px)
              clamp(28px, 8vh, 56px);
            font-size: 0.945rem;
            line-height: 1.62;
          }

          .empty-state strong {
            color: var(--text);
            font-weight: 650;
          }

          .empty-state code {
            font-size: 0.82em;
            padding: 0.12em 0.45em;
            border-radius: 6px;
            background: var(--surface-elev);
            border: 1px solid var(--border);
          }
        </style>
    </head>

    <body>
      <div class="app">
        <header class="app-header">
          <div class="brand">
            <h1>K8s Ops Chat</h1>
            <p class="subtitle">Ask about the cluster — the agent gathers context and replies here.</p>
          </div>
        </header>

        <div class="chat-scroll">
        <div id="chat" role="log" aria-live="polite" aria-relevant="additions">
          <div class="empty-state" id="emptyState">
            <strong>Start a conversation</strong><br>
            UI path <code>/k8s-ops-chat</code> · backend <code>POST /chat</code>.
          </div>
        </div>
        </div>

        <div class="composer">
          <div class="composer-inner">
            <div class="input-shell">
              <textarea
                id="message"
                rows="1"
                placeholder="Ask something about the cluster..."
                autocomplete="off"
              ></textarea>
              <button type="button" id="sendBtn">Send</button>
            </div>
            <p class="hint">Enter to send · Shift+Enter for a new line</p>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var chatEl = document.getElementById("chat");
          var messageInput = document.getElementById("message");
          var sendBtn = document.getElementById("sendBtn");
          var emptyState = document.getElementById("emptyState");
          var busy = false;

          function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text == null ? "" : String(text);
            return d.innerHTML;
          }

          function applyBoldFromEscaped(escapedLine) {
            return escapedLine.replace(
              /\*\*(.+?)\*\*/g,
              "<strong>$1</strong>"
            );
          }

          function markdownToAssistantHtml(raw) {
            var lines = String(raw).replace(/\r\n/g, "\n").split("\n");
            var out = [];
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line.trim() === "") {
                out.push('<div class="md-gap"></div>');
                continue;
              }
              var m;
              if ((m = /^###\s+(.+)$/.exec(line))) {
                out.push(
                  '<h4 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h4>"
                );
                continue;
              }
              if ((m = /^##\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^#\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^[-*]\s+(.+)$/.exec(line))) {
                out.push(
                  '<p class="md-li">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</p>"
                );
                continue;
              }
              out.push(
                '<p class="md-p">' +
                  applyBoldFromEscaped(escapeHtml(line)) +
                  "</p>"
              );
            }
            return out.join("");
          }

          function hideEmptyIfNeeded() {
            if (emptyState && emptyState.parentNode) emptyState.remove();
          }

          function scrollChat() {
            chatEl.scrollTop = chatEl.scrollHeight;
          }

          function createRow(kind) {
            var row = document.createElement("div");
            row.className = "msg-row " + kind;

            var av = document.createElement("div");
            av.className = "avatar";
            av.setAttribute("aria-hidden", "true");
            av.textContent = kind === "user" ? "You" : "AI";

            var wrap = document.createElement("div");
            wrap.className = "bubble-wrap";

            var label = document.createElement("div");
            label.className = "label";
            label.textContent = kind === "user" ? "You" : "Assistant";

            var bubble = document.createElement("div");
            bubble.className = "bubble";

            wrap.appendChild(label);
            wrap.appendChild(bubble);
            row.appendChild(av);
            row.appendChild(wrap);
            chatEl.appendChild(row);
            return bubble;
          }

          function appendUserMessage(text) {
            hideEmptyIfNeeded();
            var b = createRow("user");
            b.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
            scrollChat();
          }

          function appendAssistantMessage(text, isError) {
            hideEmptyIfNeeded();
            var b = createRow("assistant");
            if (isError) {
              b.classList.add("error");
              b.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
            } else {
              b.classList.add("prose");
              b.innerHTML = markdownToAssistantHtml(text);
            }
            scrollChat();
          }

          function showTyping() {
            hideEmptyIfNeeded();
            var row = document.createElement("div");
            row.className = "msg-row assistant";
            row.setAttribute("data-typing", "1");

            var av = document.createElement("div");
            av.className = "avatar";
            av.textContent = "AI";

            var wrap = document.createElement("div");
            wrap.className = "bubble-wrap";

            var label = document.createElement("div");
            label.className = "label";
            label.textContent = "Assistant";

            var bubble = document.createElement("div");
            bubble.className = "bubble typing";
            bubble.setAttribute("aria-label", "Assistant is thinking");
            for (var i = 0; i < 3; i++) {
              bubble.appendChild(document.createElement("span"));
            }

            wrap.appendChild(label);
            wrap.appendChild(bubble);
            row.appendChild(av);
            row.appendChild(wrap);
            chatEl.appendChild(row);
            scrollChat();
            return row;
          }

          function removeTypingRow(row) {
            if (row && row.parentNode) row.parentNode.removeChild(row);
          }

          function autoResize() {
            messageInput.style.height = "auto";
            messageInput.style.height = Math.min(messageInput.scrollHeight, 180) + "px";
          }

          messageInput.addEventListener("input", autoResize);

          async function sendMessage() {
            var message = messageInput.value;
            if (!message.trim() || busy) return;

            busy = true;
            sendBtn.disabled = true;

            appendUserMessage(message);
            messageInput.value = "";
            autoResize();

            var typingRow = showTyping();

            try {
              var response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
              });

              var data;
              try {
                data = await response.json();
              } catch (e) {
                data = { error: "Invalid response from server (not JSON)." };
              }

              removeTypingRow(typingRow);

              var aiText =
                data && (data.response != null ? data.response : data.error);
              if (aiText == null || aiText === "") {
                aiText = "No response returned";
              }

              if (!response.ok) {
                appendAssistantMessage(
                  (typeof aiText === "string" ? aiText : String(aiText)) +
                    (response.status ? " (HTTP " + response.status + ")" : ""),
                  true
                );
              } else {
                appendAssistantMessage(
                  typeof aiText === "string" ? aiText : String(aiText),
                  false
                );
              }
            } catch (error) {
              removeTypingRow(typingRow);
              appendAssistantMessage(String(error), true);
            } finally {
              busy = false;
              sendBtn.disabled = false;
              messageInput.focus();
            }
          }

          sendBtn.addEventListener("click", sendMessage);

          messageInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });

          messageInput.focus();
        })();
      </script>
    </body>
    </html>
