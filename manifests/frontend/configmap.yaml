apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Base path: UI is served under /k8s-ops-chat (API remains POST /chat) -->
        <base href="/k8s-ops-chat/">

        <title>K8s Ops Chat</title>

        <style>
          :root {
            --bg: #f4f4f5;
            --surface: #ffffff;
            --border: #e4e4e7;
            --text: #18181b;
            --text-muted: #71717a;
            --user-bubble: #18181b;
            --user-text: #fafafa;
            --assistant-bubble: #ffffff;
            --assistant-text: #27272a;
            --accent: #2563eb;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 12px rgba(0,0,0,.04);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          }

          * { box-sizing: border-box; }

          html, body {
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
          }

          .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
          }

          header.app-header {
            flex-shrink: 0;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            box-shadow: var(--shadow);
          }

          header.app-header h1 {
            font-size: 1.05rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.02em;
          }

          header .subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 2px 0 0;
          }

          .brand {
            display: flex;
            flex-direction: column;
            gap: 0;
          }

          #chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px 120px;
            display: flex;
            flex-direction: column;
            gap: 20px;
          }

          .msg-row {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            max-width: 100%;
            animation: fadeIn 0.25s ease;
          }

          @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
          }

          .msg-row.user {
            flex-direction: row-reverse;
          }

          .avatar {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.02em;
          }

          .msg-row.user .avatar {
            background: linear-gradient(145deg, #27272a, #18181b);
            color: #fafafa;
          }

          .msg-row.assistant .avatar {
            background: linear-gradient(145deg, var(--accent), #1d4ed8);
            color: #fff;
          }

          .bubble-wrap {
            max-width: min(85%, 640px);
            display: flex;
            flex-direction: column;
            gap: 4px;
          }

          .msg-row.user .bubble-wrap { align-items: flex-end; }
          .msg-row.assistant .bubble-wrap { align-items: flex-start; }

          .label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 0 4px;
          }

          .bubble {
            padding: 12px 16px;
            border-radius: var(--radius-lg);
            line-height: 1.55;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-break: break-word;
            border: 1px solid transparent;
          }

          .msg-row.user .bubble {
            background: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,.12);
          }

          .msg-row.assistant .bubble {
            background: var(--assistant-bubble);
            color: var(--assistant-text);
            border-color: var(--border);
            border-bottom-left-radius: 6px;
            box-shadow: var(--shadow);
          }

          .bubble.error {
            border-color: #fecaca;
            background: #fef2f2;
            color: #991b1b;
          }

          .composer {
            flex-shrink: 0;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 16px 20px 20px;
            background: linear-gradient(to top, var(--bg) 70%, transparent);
          }

          .composer-inner {
            max-width: 900px;
            margin: 0 auto;
          }

          .input-shell {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            box-shadow: var(--shadow);
          }

          .input-shell:focus-within {
            border-color: #a1a1aa;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
          }

          #message {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 24px;
            max-height: 180px;
            font: inherit;
            font-size: 0.95rem;
            line-height: 1.45;
            background: transparent;
            color: var(--text);
          }

          #message::placeholder {
            color: var(--text-muted);
          }

          #sendBtn {
            flex-shrink: 0;
            height: 40px;
            padding: 0 18px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.875rem;
            color: #fff;
            background: var(--accent);
            transition: background 0.15s ease, opacity 0.15s ease;
          }

          #sendBtn:hover:not(:disabled) {
            background: #1d4ed8;
          }

          #sendBtn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
          }

          .hint {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 8px;
            padding-left: 4px;
          }

          .typing {
            display: flex;
            gap: 5px;
            padding: 14px 16px;
            align-items: center;
          }

          .typing span {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: bounce 1.2s infinite ease-in-out;
          }

          .typing span:nth-child(2) { animation-delay: 0.15s; }
          .typing span:nth-child(3) { animation-delay: 0.3s; }

          @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.65); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
          }

          .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 48px 24px;
            font-size: 0.95rem;
            line-height: 1.6;
          }

          .empty-state strong {
            color: var(--text);
          }
        </style>
    </head>

    <body>
      <div class="app">
        <header class="app-header">
          <div class="brand">
            <h1>K8s Ops Chat</h1>
            <p class="subtitle">Ask about the cluster — the agent gathers context and replies here.</p>
          </div>
        </header>

        <div id="chat" role="log" aria-live="polite" aria-relevant="additions">
          <div class="empty-state" id="emptyState">
            <strong>Start a conversation</strong><br>
            Open this UI at <code style="font-size:0.85em">/k8s-ops-chat</code> · messages use <code style="font-size:0.85em">POST /chat</code>.
          </div>
        </div>

        <div class="composer">
          <div class="composer-inner">
            <div class="input-shell">
              <textarea
                id="message"
                rows="1"
                placeholder="Ask something about the cluster..."
                autocomplete="off"
              ></textarea>
              <button type="button" id="sendBtn">Send</button>
            </div>
            <p class="hint">Enter to send · Shift+Enter for a new line</p>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var chatEl = document.getElementById("chat");
          var messageInput = document.getElementById("message");
          var sendBtn = document.getElementById("sendBtn");
          var emptyState = document.getElementById("emptyState");
          var busy = false;

          function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text == null ? "" : String(text);
            return d.innerHTML;
          }

          function hideEmptyIfNeeded() {
            if (emptyState && emptyState.parentNode) emptyState.remove();
          }

          function scrollChat() {
            chatEl.scrollTop = chatEl.scrollHeight;
          }

          function createRow(kind) {
            var row = document.createElement("div");
            row.className = "msg-row " + kind;

            var av = document.createElement("div");
            av.className = "avatar";
            av.setAttribute("aria-hidden", "true");
            av.textContent = kind === "user" ? "You" : "AI";

            var wrap = document.createElement("div");
            wrap.className = "bubble-wrap";

            var label = document.createElement("div");
            label.className = "label";
            label.textContent = kind === "user" ? "You" : "Assistant";

            var bubble = document.createElement("div");
            bubble.className = "bubble";

            wrap.appendChild(label);
            wrap.appendChild(bubble);
            row.appendChild(av);
            row.appendChild(wrap);
            chatEl.appendChild(row);
            return bubble;
          }

          function appendUserMessage(text) {
            hideEmptyIfNeeded();
            var b = createRow("user");
            b.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
            scrollChat();
          }

          function appendAssistantMessage(text, isError) {
            hideEmptyIfNeeded();
            var b = createRow("assistant");
            if (isError) b.classList.add("error");
            b.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
            scrollChat();
          }

          function showTyping() {
            hideEmptyIfNeeded();
            var row = document.createElement("div");
            row.className = "msg-row assistant";
            row.setAttribute("data-typing", "1");

            var av = document.createElement("div");
            av.className = "avatar";
            av.textContent = "AI";

            var wrap = document.createElement("div");
            wrap.className = "bubble-wrap";

            var label = document.createElement("div");
            label.className = "label";
            label.textContent = "Assistant";

            var bubble = document.createElement("div");
            bubble.className = "bubble typing";
            bubble.setAttribute("aria-label", "Assistant is thinking");
            for (var i = 0; i < 3; i++) {
              bubble.appendChild(document.createElement("span"));
            }

            wrap.appendChild(label);
            wrap.appendChild(bubble);
            row.appendChild(av);
            row.appendChild(wrap);
            chatEl.appendChild(row);
            scrollChat();
            return row;
          }

          function removeTypingRow(row) {
            if (row && row.parentNode) row.parentNode.removeChild(row);
          }

          function autoResize() {
            messageInput.style.height = "auto";
            messageInput.style.height = Math.min(messageInput.scrollHeight, 180) + "px";
          }

          messageInput.addEventListener("input", autoResize);

          async function sendMessage() {
            var message = messageInput.value;
            if (!message.trim() || busy) return;

            busy = true;
            sendBtn.disabled = true;

            appendUserMessage(message);
            messageInput.value = "";
            autoResize();

            var typingRow = showTyping();

            try {
              var response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message })
              });

              var data;
              try {
                data = await response.json();
              } catch (e) {
                data = { error: "Invalid response from server (not JSON)." };
              }

              removeTypingRow(typingRow);

              var aiText =
                data && (data.response != null ? data.response : data.error);
              if (aiText == null || aiText === "") {
                aiText = "No response returned";
              }

              if (!response.ok) {
                appendAssistantMessage(
                  (typeof aiText === "string" ? aiText : String(aiText)) +
                    (response.status ? " (HTTP " + response.status + ")" : ""),
                  true
                );
              } else {
                appendAssistantMessage(
                  typeof aiText === "string" ? aiText : String(aiText),
                  false
                );
              }
            } catch (error) {
              removeTypingRow(typingRow);
              appendAssistantMessage(String(error), true);
            } finally {
              busy = false;
              sendBtn.disabled = false;
              messageInput.focus();
            }
          }

          sendBtn.addEventListener("click", sendMessage);

          messageInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });

          messageInput.focus();
        })();
      </script>
    </body>
    </html>
