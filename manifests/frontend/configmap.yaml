apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: default

data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#07090e">

        <base href="/k8s-ops-chat/">

        <title>K8s Ops Chat</title>

        <style>
          :root {
            color-scheme: dark;
            --bg0: #06080d;
            --bg1: #0a0e16;
            --sidebar-bg: rgba(10,13,20,.97);
            --header-bg: rgba(11,14,22,.88);
            --surface: #131822;
            --surface-2: #1a2130;
            --border: rgba(255,255,255,.065);
            --border-hover: rgba(255,255,255,.12);
            --text: #e8eaef;
            --text-soft: #9aa3b2;
            --muted: #64708b;
            --accent: #5b8def;
            --accent-soft: rgba(91,141,239,.14);
            --accent-ring: rgba(91,141,239,.28);
            --user-edge: rgba(91,141,239,.55);
            --assistant-bg: rgba(22,28,40,.96);
            --danger-bg: rgba(120,30,30,.38);
            --danger-text: #fecaca;
            --danger-br: rgba(251,113,133,.32);
            --radius: 14px;
            --sidebar-w: 288px;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
          }

          * { box-sizing: border-box; }

          html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: var(--bg0);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
          }

          body {
            background:
              radial-gradient(ellipse 90% 70% at 70% -25%, rgba(91,141,239,.11), transparent 50%),
              linear-gradient(165deg, var(--bg0), var(--bg1) 45%);
          }

          button {
            font: inherit;
            cursor: pointer;
          }

          .layout {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100%;
            overflow: hidden;
          }

          /* —— Sidebar —— */
          .sidebar {
            width: var(--sidebar-w);
            flex-shrink: 0;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            min-height: 0;
            z-index: 30;
          }

          .sidebar-head {
            padding: 14px 14px 10px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 10px;
          }

          .sidebar-brand {
            font-weight: 700;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
          }

          .btn-new-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 11px 12px;
            border-radius: 11px;
            border: 1px solid var(--border-hover);
            background: linear-gradient(180deg, rgba(91,141,239,.28), rgba(91,141,239,.06));
            color: var(--text);
            font-weight: 630;
            font-size: 0.88rem;
            transition: background .15s, border-color .15s;
          }

          .btn-new-chat:hover {
            background: linear-gradient(180deg, rgba(91,141,239,.4), rgba(91,141,239,.12));
            border-color: rgba(91,141,239,.42);
          }

          .sidebar-search-wrap {
            position: relative;
          }

          .sidebar-search-wrap svg {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--muted);
            pointer-events: none;
          }

          #chatSearch {
            width: 100%;
            padding: 9px 12px 9px 32px;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,.26);
            color: var(--text);
            font-size: 0.84rem;
            outline: none;
          }

          #chatSearch::placeholder {
            color: var(--muted);
          }

          #chatSearch:focus {
            border-color: rgba(91,141,239,.45);
          }

          .sidebar-list-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 8px 8px 12px;
            scrollbar-color: rgba(255,255,255,.15) transparent;
          }

          .sidebar-item {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            text-align: left;
            gap: 2px;
            width: 100%;
            padding: 10px 11px;
            margin-bottom: 4px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-soft);
            transition: background .12s;
          }

          .sidebar-item:hover {
            background: rgba(255,255,255,.045);
          }

          .sidebar-item.active {
            background: var(--accent-soft);
            color: var(--text);
          }

          .sidebar-item-title {
            font-size: 0.86rem;
            font-weight: 580;
            line-height: 1.32;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
          }

          .sidebar-item-meta {
            font-size: 0.68rem;
            color: var(--muted);
          }

          .sidebar-empty {
            padding: 20px 12px;
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.45;
          }

          /* —— Main —— */
          .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            min-height: 0;
          }

          header.app-header {
            flex-shrink: 0;
            padding: 9px clamp(12px, 2.5vw, 22px);
            border-bottom: 1px solid var(--border);
            background: var(--header-bg);
            backdrop-filter: blur(14px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          }

          .header-left {
            display: flex;
            align-items: center;
            gap: 11px;
            min-width: 0;
          }

          #btnMenu {
            display: none;
            width: 40px;
            height: 40px;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: rgba(0,0,0,.2);
            color: var(--text);
          }

          .brand h1 {
            font-size: 1rem;
            font-weight: 650;
            margin: 0;
            letter-spacing: -0.03em;
            background: linear-gradient(92deg, var(--text), rgba(91,141,239,.94));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
          }

          .brand .subtitle {
            font-size: 0.72rem;
            color: var(--text-soft);
            margin: 2px 0 0;
            line-height: 1.42;
          }

          .model-pill {
            flex-shrink: 0;
            max-width: min(420px, 46vw);
            padding: 5px 10px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 550;
            color: var(--text-soft);
            background: rgba(0,0,0,.33);
            border: 1px solid var(--border);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }

          .model-pill .model-id {
            color: rgba(180,206,255,.95);
          }

          .messages-scroll {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            scrollbar-color: rgba(255,255,255,.17) transparent;
          }

          .messages-inner {
            max-width: 820px;
            margin: 0 auto;
            padding: clamp(12px, 2vw, 20px)
              clamp(14px, 3vw, 28px)
              18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
          }

          .messages-scroll::-webkit-scrollbar { width: 7px; }
          .messages-scroll::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,.12);
            border-radius: 8px;
          }

          /* Message rows — no avatars / role labels */
          .msg-msg {
            display: flex;
            flex-direction: column;
            gap: 0;
            animation: rise .32s cubic-bezier(.22,1,.36,1);
          }

          @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
          }

          .msg-msg.user { align-self: flex-end; max-width: min(560px, 92%); }

          .msg-msg.assistant { align-self: flex-start; max-width: min(720px, 96%); }

          .bubble-shell { width: 100%; }

          .bubble {
            border-radius: var(--radius);
            padding: 13px 16px;
            line-height: 1.53;
            font-size: 0.93rem;
            word-break: break-word;
            border: 1px solid var(--border);
          }

          .msg-msg.user .bubble {
            background: linear-gradient(
              148deg,
              rgba(43,71,118,.94) 0%,
              rgba(24,40,74,.94) 100%
            );
            border-color: rgba(91,141,239,.38);
            box-shadow:
              inset 0 1px rgba(255,255,255,.06),
              0 2px 0 var(--user-edge);
            white-space: pre-wrap;
          }

          .msg-msg.assistant .bubble {
            background: var(--assistant-bg);
          }

          .bubble.error {
            background: var(--danger-bg);
            color: var(--danger-text);
            border-color: var(--danger-br);
          }

          .bubble.prose h3.md-heading {
            margin: 0 0 0.4em;
            font-size: 1.03rem;
            font-weight: 650;
          }

          .bubble.prose h4.md-heading {
            margin: 0.9em 0 0.38em;
            font-size: 0.92rem;
            font-weight: 640;
            color: #cdd3de;
          }

          .bubble.prose h3.md-heading:first-child,
          .bubble.prose h4.md-heading:first-child { margin-top: 0; }

          .bubble.prose p.md-p {
            margin: 0.4em 0;
            white-space: pre-wrap;
          }

          .bubble.prose p.md-p:first-child { margin-top: 0; }
          .bubble.prose p.md-p:last-child { margin-bottom: 0; }

          .bubble.prose p.md-li {
            margin: 0.25em 0;
            padding-left: 1.05rem;
            position: relative;
            color: #d9dee8;
          }

          .bubble.prose p.md-li::before {
            content: "";
            position: absolute;
            left: 3px;
            top: 0.65em;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
          }

          .bubble.prose strong { font-weight: 650; color: #fff; }

          .bubble.prose .md-gap { height: 0.55em; }

          .typing-dot {
            display: inline-flex;
            gap: 5px;
            padding: 4px 0;
          }

          .typing-dot span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--muted);
            animation: bounce 1.15s infinite ease-in-out;
          }

          .typing-dot span:nth-child(2) { animation-delay: 0.13s; }
          .typing-dot span:nth-child(3) { animation-delay: 0.26s; }

          @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.55); opacity: 0.42; }
            40% { transform: scale(1); opacity: 0.9; }
          }

          /* Composer */
          .composer {
            flex-shrink: 0;
            padding: 10px clamp(14px, 3vw, 22px)
              calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border);
            background: rgba(8,11,17,.94);
            backdrop-filter: blur(12px);
          }

          .composer-inner {
            max-width: 820px;
            margin: 0 auto;
          }

          .input-shell {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(26,33,46,.94);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 6px 6px 6px 16px;
            box-shadow:
              inset 0 1px rgba(255,255,255,.04),
              0 -1px rgba(91,141,239,.06);
          }

          .input-shell:focus-within {
            border-color: rgba(91,141,239,.52);
            box-shadow:
              inset 0 1px rgba(255,255,255,.05),
              0 0 0 4px var(--accent-ring);
          }

          #message {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 42px;
            max-height: 200px;
            padding: 10px 0;
            font: inherit;
            font-size: 0.935rem;
            line-height: 1.41;
            background: transparent;
            color: var(--text);
          }

          #message::placeholder { color: var(--muted); }

          #sendBtn {
            flex-shrink: 0;
            width: 42px;
            height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: none;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.35), transparent 62%),
                        linear-gradient(145deg, #6b9dff, var(--accent) 52%, #3d73e6);
            color: #071018;
            box-shadow:
              inset 0 1px rgba(255,255,255,.45),
              0 6px 20px rgba(45,106,219,.43);
            transition: transform .1s ease, opacity .15s ease, filter .15s ease;
          }

          #sendBtn svg { stroke: currentColor; }

          #sendBtn:hover:not(:disabled) {
            filter: brightness(1.06);
          }

          #sendBtn:active:not(:disabled) {
            transform: scale(0.95);
          }

          #sendBtn:disabled {
            opacity: .38;
            cursor: not-allowed;
          }

          .hint {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 7px;
            padding-left: 14px;
          }

          .empty-state {
            text-align: center;
            color: var(--text-soft);
            padding: clamp(24px, 7vh, 48px) 16px;
            font-size: 0.9rem;
            line-height: 1.55;
          }

          .empty-state strong { color: var(--text); font-weight: 650; }

          .empty-state code {
            font-size: 0.82em;
            padding: 0.1em 0.4em;
            border-radius: 6px;
            background: var(--surface-2);
            border: 1px solid var(--border);
          }

          .sidebar-scrim {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.52);
            z-index: 25;
          }

          .sidebar-scrim.show { display: block; }

          @media (max-width: 880px) {
            #btnMenu { display: inline-flex; }
            .sidebar {
              position: fixed;
              left: 0;
              top: 0;
              bottom: 0;
              transform: translateX(-102%);
              box-shadow: 12px 0 40px rgba(0,0,0,.45);
            }
            .sidebar.open { transform: translateX(0); }
            .model-pill { display: none; }
          }
        </style>
    </head>

    <body>
      <div class="layout">
        <aside class="sidebar" id="sidebar" aria-label="Chats">
          <div class="sidebar-head">
            <div class="sidebar-brand">Chats</div>
            <button type="button" class="btn-new-chat" id="btnNewChat">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
              New chat
            </button>
            <div class="sidebar-search-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
              <input type="search" id="chatSearch" placeholder="Search chats…" autocomplete="off" />
            </div>
          </div>
          <div class="sidebar-list-scroll" id="sidebarList"></div>
        </aside>

        <div class="sidebar-scrim" id="sidebarScrim" aria-hidden="true"></div>

        <div class="main">
          <header class="app-header">
            <div class="header-left">
              <button type="button" id="btnMenu" aria-label="Open chat list">☰</button>
              <div class="brand">
                <h1>K8s Ops Chat</h1>
                <p class="subtitle" id="headerSubtitle">Cluster read-only agent</p>
              </div>
            </div>
            <div class="model-pill" id="modelPill" title="LLM from agent-controller">Loading model…</div>
          </header>

          <div class="messages-scroll" id="messagesScroll">
            <div class="messages-inner" id="chat" role="log" aria-live="polite" aria-relevant="additions">
              <div class="empty-state" id="emptyState">
                <strong>New chat</strong><br>
                Ask about workloads, cost, or GitOps. UI <code>/k8s-ops-chat</code> · API <code>POST /chat</code>.
              </div>
            </div>
          </div>

          <div class="composer">
            <div class="composer-inner">
              <div class="input-shell">
                <textarea id="message" rows="1" placeholder="Message the cluster agent…" autocomplete="off"></textarea>
                <button type="button" id="sendBtn" title="Send" aria-label="Send message">
                  <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5"/>
                    <path d="M5 12l7-7 7 7"/>
                  </svg>
                </button>
              </div>
              <p class="hint">Enter to send · Shift+Enter for a new line</p>
            </div>
          </div>
        </div>
      </div>

      <script>
        (function () {
          var STORAGE_KEY = "k8s-ops-chat-sessions-v1";
          var chatEl = document.getElementById("chat");
          var messagesScroll = document.getElementById("messagesScroll");
          var messageInput = document.getElementById("message");
          var sendBtn = document.getElementById("sendBtn");
          var emptyState = document.getElementById("emptyState");
          var sidebarList = document.getElementById("sidebarList");
          var chatSearch = document.getElementById("chatSearch");
          var btnNewChat = document.getElementById("btnNewChat");
          var modelPill = document.getElementById("modelPill");
          var headerSubtitle = document.getElementById("headerSubtitle");
          var sidebar = document.getElementById("sidebar");
          var sidebarScrim = document.getElementById("sidebarScrim");
          var btnMenu = document.getElementById("btnMenu");

          var busy = false;
          var store = { version: 1, sessions: [], activeId: null };
          var modelLabel = "gemini";
          var apiBaseDisplay = "";

          function escapeHtml(text) {
            var d = document.createElement("div");
            d.textContent = text == null ? "" : String(text);
            return d.innerHTML;
          }

          function applyBoldFromEscaped(escapedLine) {
            return escapedLine.replace(
              /\*\*(.+?)\*\*/g,
              "<strong>$1</strong>"
            );
          }

          function markdownToAssistantHtml(raw) {
            var lines = String(raw).replace(/\r\n/g, "\n").split("\n");
            var out = [];
            for (var i = 0; i < lines.length; i++) {
              var line = lines[i];
              if (line.trim() === "") {
                out.push('<div class="md-gap"></div>');
                continue;
              }
              var m;
              if ((m = /^###\s+(.+)$/.exec(line))) {
                out.push(
                  '<h4 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h4>"
                );
                continue;
              }
              if ((m = /^##\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^#\s+(.+)$/.exec(line))) {
                out.push(
                  '<h3 class="md-heading">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</h3>"
                );
                continue;
              }
              if ((m = /^[-*]\s+(.+)$/.exec(line))) {
                out.push(
                  '<p class="md-li">' +
                    applyBoldFromEscaped(escapeHtml(m[1])) +
                    "</p>"
                );
                continue;
              }
              out.push(
                '<p class="md-p">' +
                  applyBoldFromEscaped(escapeHtml(line)) +
                  "</p>"
              );
            }
            return out.join("");
          }

          function uid() {
            if (typeof crypto !== "undefined" && crypto.randomUUID) {
              return crypto.randomUUID();
            }
            return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
          }

          function loadStore() {
            try {
              var raw = localStorage.getItem(STORAGE_KEY);
              if (!raw) return;
              var parsed = JSON.parse(raw);
              if (parsed && parsed.version === 1 && Array.isArray(parsed.sessions)) {
                store = parsed;
              }
            } catch (e) {}
          }

          function saveStore() {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
            } catch (e) {}
          }

          function activeSession() {
            if (!store.activeId) return null;
            for (var i = 0; i < store.sessions.length; i++) {
              if (store.sessions[i].id === store.activeId) {
                return store.sessions[i];
              }
            }
            return null;
          }

          function touchSession(sess) {
            sess.updatedAt = Date.now();
            store.sessions.sort(function (a, b) {
              return b.updatedAt - a.updatedAt;
            });
          }

          function ensureSession() {
            if (activeSession()) return;
            var s = {
              id: uid(),
              title: "New chat",
              updatedAt: Date.now(),
              messages: [],
            };
            store.sessions.unshift(s);
            store.activeId = s.id;
            saveStore();
          }

          function hideEmptyIfNeeded() {
            if (emptyState && emptyState.parentNode) emptyState.remove();
          }

          function scrollMessagesToEnd() {
            messagesScroll.scrollTop = messagesScroll.scrollHeight;
          }

          function findSession(id) {
            for (var i = 0; i < store.sessions.length; i++) {
              if (store.sessions[i].id === id) return store.sessions[i];
            }
            return null;
          }

          function updateModelUI() {
            var hostShort = "";
            if (apiBaseDisplay) {
              hostShort = apiBaseDisplay.replace(/^https:\/\//, "");
              if (hostShort.length > 44) {
                hostShort = hostShort.slice(0, 44) + "…";
              }
            }
            modelPill.innerHTML =
              '<span class="model-id">' +
              escapeHtml(modelLabel) +
              "</span>" +
              (hostShort
                ? ' <span style="opacity:.72">· ' +
                  escapeHtml(hostShort) +
                  "</span>"
                : "");

            headerSubtitle.innerHTML =
              'Powered by <code style="font-size:inherit;color:rgba(154,174,216,.92)">' +
              escapeHtml(modelLabel) +
              "</code> · read-only cluster tools";
          }

          function fetchModelMeta() {
            fetch("/chat", { method: "GET" })
              .then(function (r) {
                return r.json().catch(function () { return {}; });
              })
              .then(function (data) {
                if (data && data.model) {
                  modelLabel = String(data.model);
                  apiBaseDisplay = data.api_base_display
                    ? String(data.api_base_display)
                    : "";
                }
                updateModelUI();
              })
              .catch(function () {
                modelPill.textContent = "Model (offline)";
                headerSubtitle.textContent =
                  "Could not reach agent-controller metadata";
              });
          }

          function renderSidebarList() {
            var q = (chatSearch.value || "").trim().toLowerCase();
            sidebarList.innerHTML = "";

            var sessions = store.sessions.slice();
            sessions.sort(function (a, b) {
              return b.updatedAt - a.updatedAt;
            });

            if (q) {
              sessions = sessions.filter(function (s) {
                if (
                  String(s.title)
                    .toLowerCase()
                    .indexOf(q) >= 0
                ) {
                  return true;
                }
                var msgs = s.messages || [];
                for (var i = 0; i < msgs.length; i++) {
                  if (
                    String(msgs[i].text || "")
                      .toLowerCase()
                      .indexOf(q) >= 0
                  ) {
                    return true;
                  }
                }
                return false;
              });
            }

            if (sessions.length === 0) {
              var emp = document.createElement("div");
              emp.className = "sidebar-empty";
              emp.textContent = q ? "No chats match your search." : "No chats yet — start below.";
              sidebarList.appendChild(emp);
              return;
            }

            for (var j = 0; j < sessions.length; j++) {
              var sess = sessions[j];
              var btn = document.createElement("button");
              btn.type = "button";
              btn.className = "sidebar-item" + (sess.id === store.activeId ? " active" : "");

              var t = document.createElement("span");
              t.className = "sidebar-item-title";
              t.textContent = sess.title || "Untitled";

              var meta = document.createElement("span");
              meta.className = "sidebar-item-meta";
              var d = new Date(sess.updatedAt);
              meta.textContent = d.toLocaleString(undefined, {
                dateStyle: "medium",
                timeStyle: "short",
              });

              btn.appendChild(t);
              btn.appendChild(meta);
              btn.addEventListener("click", function (id) {
                return function () {
                  store.activeId = id;
                  saveStore();
                  renderSidebarList();
                  renderThread();
                  sidebar.classList.remove("open");
                  sidebarScrim.classList.remove("show");
                };
              }(sess.id));

              sidebarList.appendChild(btn);
            }
          }

          function clearDomMessages() {
            while (chatEl.firstChild) {
              chatEl.removeChild(chatEl.firstChild);
            }
          }

          function renderThread() {
            clearDomMessages();
            var sess = activeSession();
            if (!sess || !sess.messages.length) {
              chatEl.innerHTML =
                '<div class="empty-state" id="emptyState"><strong>New chat</strong><br>Ask anything about your cluster resources or GitOps sync.</div>';
              emptyState = document.getElementById("emptyState");
              scrollMessagesToEnd();
              renderSidebarList();
              return;
            }

            hideEmptyIfNeeded();

            var msgs = sess.messages;
            for (var i = 0; i < msgs.length; i++) {
              var mrow = msgs[i];
              appendMessageRowDom(mrow.role, mrow.text, mrow.isError);
            }

            scrollMessagesToEnd();
            renderSidebarList();
          }

          function appendMessageRowDom(role, text, isError) {
            hideEmptyIfNeeded();

            var row = document.createElement("div");
            row.className = "msg-msg " + role;

            var shell = document.createElement("div");
            shell.className = "bubble-shell";

            var bubble = document.createElement("div");
            bubble.className = "bubble";

            if (role === "user") {
              bubble.textContent = text;
            } else {
              bubble.classList.add("prose");
              if (isError) {
                bubble.classList.add("error");
                bubble.innerHTML = escapeHtml(text).replace(/\n/g, "<br>");
              } else {
                bubble.innerHTML = markdownToAssistantHtml(text);
              }
              shell.appendChild(bubble);
              row.appendChild(shell);
              chatEl.appendChild(row);
              scrollMessagesToEnd();
              return;
            }

            shell.appendChild(bubble);
            row.appendChild(shell);
            chatEl.appendChild(row);
            scrollMessagesToEnd();
          }

          function showTypingBubble() {
            hideEmptyIfNeeded();
            var row = document.createElement("div");
            row.className = "msg-msg assistant";
            row.setAttribute("data-typing", "1");

            var shell = document.createElement("div");
            shell.className = "bubble-shell";

            var bubble = document.createElement("div");
            bubble.className = "bubble prose";
            var wrap = document.createElement("span");
            wrap.className = "typing-dot";
            wrap.setAttribute("aria-label", "Generating");
            for (var i = 0; i < 3; i++) {
              wrap.appendChild(document.createElement("span"));
            }
            bubble.appendChild(wrap);

            shell.appendChild(bubble);
            row.appendChild(shell);
            chatEl.appendChild(row);
            scrollMessagesToEnd();
            return row;
          }

          function removeTypingRow(row) {
            if (row && row.parentNode) row.parentNode.removeChild(row);
          }

          function autoResize() {
            messageInput.style.height = "auto";
            messageInput.style.height =
              Math.min(messageInput.scrollHeight, 200) + "px";
          }

          function startNewChat() {
            var s = {
              id: uid(),
              title: "New chat",
              updatedAt: Date.now(),
              messages: [],
            };
            store.sessions.unshift(s);
            store.activeId = s.id;
            saveStore();
            renderSidebarList();
            renderThread();
            messageInput.focus();
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          }

          function appendToStore(role, text, isError) {
            ensureSession();
            var sess = activeSession();
            sess.messages.push({
              role: role,
              text: text,
              isError: !!isError,
            });
            if (role === "user" && sess.title === "New chat") {
              var t = text.replace(/\s+/g, " ").trim();
              sess.title = t.slice(0, 56) + (t.length > 56 ? "…" : "");
            }
            touchSession(sess);
            saveStore();
            renderSidebarList();
          }

          async function sendMessage() {
            var message = messageInput.value;
            if (!message.trim() || busy) return;

            busy = true;
            sendBtn.disabled = true;

            ensureSession();
            appendToStore("user", message, false);
            appendMessageRowDom("user", message, false);
            messageInput.value = "";
            autoResize();

            var typingRow = showTypingBubble();

            try {
              var response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ message: message }),
              });

              var data;
              try {
                data = await response.json();
              } catch (e) {
                data = { error: "Invalid response from server (not JSON)." };
              }

              removeTypingRow(typingRow);

              var aiText =
                data && (data.response != null ? data.response : data.error);
              if (aiText == null || aiText === "") {
                aiText = "No response returned";
              }

              var err = !response.ok;
              var textOut =
                typeof aiText === "string" ? aiText : String(aiText);
              if (err && response.status) {
                textOut += " (HTTP " + response.status + ")";
              }

              appendToStore("assistant", textOut, err);
              appendMessageRowDom("assistant", textOut, err);
            } catch (error) {
              removeTypingRow(typingRow);
              var emsg = String(error);
              appendToStore("assistant", emsg, true);
              appendMessageRowDom("assistant", emsg, true);
            } finally {
              busy = false;
              sendBtn.disabled = false;
              messageInput.focus();
            }
          }

          messageInput.addEventListener("input", autoResize);

          sendBtn.addEventListener("click", sendMessage);

          messageInput.addEventListener("keydown", function (e) {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              sendMessage();
            }
          });

          btnNewChat.addEventListener("click", startNewChat);

          chatSearch.addEventListener("input", renderSidebarList);

          btnMenu.addEventListener("click", function () {
            sidebar.classList.toggle("open");
            sidebarScrim.classList.toggle("show");
          });

          sidebarScrim.addEventListener("click", function () {
            sidebar.classList.remove("open");
            sidebarScrim.classList.remove("show");
          });

          loadStore();
          if (!store.sessions.length) {
            startNewChat();
          } else {
            if (!store.activeId || !findSession(store.activeId)) {
              store.activeId = store.sessions[0].id;
              saveStore();
            }
            renderSidebarList();
            renderThread();
          }

          fetchModelMeta();
          messageInput.focus();
        })();
      </script>
    </body>
    </html>
