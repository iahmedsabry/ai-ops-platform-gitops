apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: default

data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      # K8s Ops Chat SPA (ingress path prefix /k8s-ops-chat)
      location = /k8s-ops-chat {
        root /usr/share/nginx/html;
        try_files /index.html =404;
      }

      location = /k8s-ops-chat/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
      }

      location ^~ /k8s-ops-chat/ {
        root /usr/share/nginx/html;
        rewrite ^/k8s-ops-chat/.*$ /index.html break;
      }
    }
