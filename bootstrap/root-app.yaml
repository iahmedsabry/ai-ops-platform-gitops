apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default

  source:
    # PER-ENVIRONMENT: Git URL + branch your Argo CD instance should track (fork or per-env repo).
    repoURL: https://github.com/iahmedsabry/ai-ops-platform-gitops.git
    targetRevision: HEAD
    path: apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true